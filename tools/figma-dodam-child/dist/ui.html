<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        font-family: Inter, sans-serif;
        color: #2f2d24;
        background: #fffdf5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      p {
        margin: 0 0 16px;
        color: #696556;
        font-size: 12px;
        line-height: 1.6;
      }

      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 14px;
        background: #f2d765;
        color: #2f2d24;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      #status {
        min-height: 36px;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid #e5dfc8;
        border-radius: 12px;
        background: white;
        font-size: 11px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Dodam Child UI v2 Generator</h1>
    <p>레퍼런스를 바탕으로 새로 설계한 아동 화면을 한 페이지 안에 섹션으로 정리합니다.</p>
    <button id="generate">v2 아동 화면 새로 만들기</button>
    <div id="status">준비됐어요.</div>

    <script>
      const button = document.getElementById("generate");
      const status = document.getElementById("status");

      button.onclick = () => {
        button.disabled = true;
        status.textContent = "NanumSquare Neo와 도다미 자산을 확인하고 있어요…";
        parent.postMessage({ pluginMessage: { type: "generate" } }, "*");
      };

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "progress") {
          status.textContent = message.message;
        }

        if (message.type === "complete") {
          status.textContent = `완료: ${message.pages}개 페이지, ${message.screens}개 화면`;
          button.disabled = false;
          button.textContent = "다시 만들기";
        }

        if (message.type === "error") {
          status.textContent = `오류: ${message.message}`;
          button.disabled = false;
        }
      };
    </script>
  </body>
</html>
