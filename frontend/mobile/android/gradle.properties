# Gradle 데몬 JVM 상한 (S15P11B209-356 — 2026-07-28 호스트 OOM 사고 대응)
#   종전: -Xmx8G -XX:MaxMetaspaceSize=4G  ← Flutter 템플릿 기본(4G/2G)의 2배로 올라가 있었다.
#   -Xmx 는 "쓰는 양"이 아니라 "커질 수 있는 천장"이다. 그래서 평소엔 문제가 안 보인다.
#   그러나 07-28 처럼 **컨테이너에 메모리 상한이 없는 상태**에서 빌드하면, 이 천장이
#   곧 호스트 RAM(15.6GB)의 절반을 한 프로세스가 가져갈 수 있다는 뜻이 된다.
#   Jenkins(최대힙 약 3.9GB)가 같이 떠 있었으므로 둘의 천장 합만 12GB — 호스트가 굳은 경로다.
#   3G/1G 로 낮춘다: 이 앱 규모(모듈 1개·네이티브 모듈 없음)에는 충분하고,
#   빌드 컨테이너 상한(6g) 안에서 Kotlin 데몬·dart 스냅샷이 쓸 자리를 남긴다.
#   ⚠️ OOM 으로 빌드가 실패하면 이 값을 올리기 전에 build-aab.sh 의 --memory 부터 함께 볼 것.
#      한쪽만 올리면 "힙은 커졌는데 컨테이너가 죽이는" 형태가 된다.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
