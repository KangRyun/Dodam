spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:dodam-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

app:
  cors:
    allowed-origins:
      - http://localhost:3000
