spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:dodam-test-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

app:
  auth:
    filter:
      legacy-header-enabled: true
  cors:
    allowed-origins:
      - http://localhost:3000
  # 슬라이스·컨텍스트 테스트는 주기 작업 대상이 아니므로 회수 스케줄러를 끈다.
  stt:
    recovery:
      enabled: false
