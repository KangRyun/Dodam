spring:
  config:
    activate:
      on-profile: local

  datasource:
    # sessionVariables=time_zone='+09:00' — S15P11B209-736
    #   serverTimezone 은 **드라이버가 값을 변환**할 때 쓰는 기준이라, 앱이 쓴 컬럼만 KST 가 됐다.
    #   DEFAULT CURRENT_TIMESTAMP 는 드라이버를 거치지 않고 **MySQL 세션 시간대**로 평가되므로
    #   서버 기본값(UTC)이 그대로 들어갔다 — 같은 행 안에서 started_at 은 KST, created_at 은 UTC.
    #   세션 시간대를 커넥션 단위로 고정해 두 경로를 같은 기준으로 맞춘다.
    #   %2B 는 '+' 의 URL 인코딩이다(생략하면 공백으로 해석돼 time_zone 설정이 깨진다).
    #   ⚠️ V10__unify_timestamps_to_kst.sql 과 반드시 같이 배포돼야 한다. 따로 나가면
    #      한 테이블에 두 규약이 섞이고 그 뒤로는 데이터만으로 판별할 수 없다.
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:dodam}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&sessionVariables=time_zone%3D%27%2B09%3A00%27&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 그리기 과정 데이터(스트로크) 저장소 — S15P11B209-365
  #
  # ⚠️ `uri` 를 쓰지 않고 항목을 나눠 쓴다. 둘 다 지원되지만 동작이 다르다:
  #   - `uri` 를 주면 그 문자열이 **그대로** ConnectionString 이 된다. 비밀번호에 URL 예약문자
  #     (`@` `:` `/` `?` `#` `%`)가 하나라도 있으면 접속 문자열이 조용히 깨진다.
  #   - 항목을 나눠 주면 Spring Boot(PropertiesMongoConnectionDetails)가 username·password 를
  #     URLEncoder 로 인코딩해 조립한다. 시크릿 값이 무엇이든 안전하다.
  #   지금 값은 hex 라 어느 쪽이든 되지만, 시크릿은 언제든 회전된다. 방어적인 쪽을 고른다.
  #
  # authentication-database: 앱 계정은 admin 이 아니라 dodam DB 에 있다(364 initdb).
  #   빠뜨리면 인증 DB 가 admin 으로 잡혀 AuthenticationFailed 가 난다.
  data:
    mongodb:
      host: ${MONGO_HOST:127.0.0.1}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:dodam}
      # 기본값은 로컬 개발용 자리표시자다. 운영 값은 Secret(dodam-secrets)에서만 온다.
      #   빈 문자열을 기본값으로 두면 `mongodb://:@host` 라는 깨진 자격증명이 조립된다
      #   (Boot 는 username 이 null 일 때만 자격증명 구간을 생략한다). 그래서 비워두지 않는다.
      username: ${MONGO_APP_USERNAME:dodam}
      password: ${MONGO_APP_PASSWORD:}
      authentication-database: ${MONGO_DATABASE:dodam}
      # 컬렉션·인덱스(TTL 포함)는 initdb 가 만든다(364/634). 앱이 인덱스를 만들면 보관 정책이
      # 코드와 인프라 두 곳으로 흩어진다. 앱 계정에 dbAdmin 을 주지 않은 것과 같은 취지다.
      auto-index-creation: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

app:
  mock-data:
    enabled: ${APP_MOCK_DATA_ENABLED:false}

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000

  # AI 서버 없이 BE·FE를 돌리기 위한 mock 연동 (S15P11B209-722).
  #   기본값을 http 로 뒤집었으므로(운영에서 조용히 가짜로 도는 사고 방지) 로컬 편의는
  #   여기서 명시적으로 켠다. "빼먹으면 mock" 이 아니라 "원하면 mock" 이 안전한 방향이다.
  #   실제 AI 서버를 로컬에서 붙여볼 때는 환경변수로 개별 덮어쓰기(AI_TTS_MODE=http 등).
  ai:
    drawing-analysis:
      mode: ${AI_DRAWING_ANALYSIS_MODE:mock}
    observation:
      mode: ${AI_OBSERVATION_MODE:mock}
    tts:
      mode: ${AI_TTS_MODE:mock}
