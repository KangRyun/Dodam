spring:
  application:
    name: b209
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080

app:
  cors:
    allowed-origins: []
  storage:
    image:
      root: ${LOCAL_IMAGE_STORAGE_ROOT:./storage/images}
      max-size: ${LOCAL_IMAGE_MAX_SIZE:10485760}
