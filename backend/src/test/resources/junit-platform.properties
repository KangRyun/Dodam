# JUnit 5 병렬 실행 금지 — 명시적 선언 (S15P11B209-391 Phase 3)
#
# 통합테스트는 IntegrationTestSupport를 통해 MySQL Testcontainer를 JVM당 1개만 띄워 공유하고,
# 매 테스트 전에 flyway_schema_history를 제외한 전체 테이블을 TRUNCATE 해서 격리한다.
# 같은 JVM 안에서 클래스를 병렬 실행하면 서로의 데이터를 지우게 되므로 이 방식과 양립할 수 없다.
#
# 기본값도 false지만, 나중에 "테스트가 느리다"는 이유로 무심코 켜지는 것을 막으려고 명시해 둔다.
# 병렬화가 필요해지면 같은 JVM 안의 스레드 병렬이 아니라, 컨테이너를 fork당 1개로 두는
# Gradle maxParallelForks 방식을 검토할 것. (근거: docs 및 Notion 'CI 빌드시간 개선 측정 리포트')
junit.jupiter.execution.parallel.enabled=false
