plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.8.0'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.49.3')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // 보호자 PIN 해시(BCrypt)용. spring-security-crypto 는 웹 보안 필터를 끌고 오지 않는 순수 암호 모듈이다
    // (S15P11B209-879). Argon2id 는 bouncycastle 이 더 필요한데 pepper 를 함께 쓰므로 실익 차이가 작다.
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'com.google.firebase:firebase-admin:9.2.0'
    implementation 'com.drewnoakes:metadata-extractor:2.21.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:mongodb'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // 정적 법적 고지 문서를 test 태스크의 선언된 입력으로 등록한다.
    // backend/ 는 자체 settings.gradle 을 가진 독립 Gradle 루트라, LegalDocumentConsistencyTest 가
    // 읽는 ../infra/nginx/html/legal/ 은 이 프로젝트 밖이다. 선언하지 않으면 Gradle 이 입력이
    // 안 바뀌었다고 보고 :test 를 UP-TO-DATE 로 통째로 건너뛴다 — 정적 약관만 고친 커밋에서
    // 드리프트 가드가 아예 실행되지 않는다(S15P11B209-783 QA B-1 실측).
    // CI 도 같은 조건이다: Jenkinsfile 은 clean 없이 --build-cache 로 워크스페이스를 재사용한다.
    // 실제로 이 이슈의 드리프트를 만든 커밋 1ef6b586(628)이 infra/ 만 건드린 커밋이었다.
    // 디렉터리가 없으면 fileTree 는 빈 집합이 되어 빌드가 깨지지 않는다. 파일 부재 자체는
    // LegalDocumentConsistencyTest 가 실패로 처리한다(조용한 skip 없음).
    inputs.files(fileTree(project.file('../infra/nginx/html/legal')))
            .withPropertyName('legalStaticDocuments')
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .optional()

    // 테스트 JVM 힙. 명시하지 않으면 Gradle 기본값 512MB가 적용된다.
    // 통합테스트가 Spring 컨텍스트를 여러 벌 띄우고 Testcontainers 까지 함께 물면 그 한도를 넘겨
    // OutOfMemoryError 가 난다. 한 번만 나도 피해가 크다 — 컨텍스트 로딩 실패를 Spring 이 캐시하므로
    // (DefaultCacheAwareContextLoaderDelegate) 같은 컨텍스트를 쓰는 테스트가 전부 연쇄로 죽는다.
    // 2026-07-31 develop 빌드 91: 실패 47건 중 46건이 OOM 1회에서 파생된 도미노였다.
    maxHeapSize = '2g'

    // 통합테스트는 MySQL Testcontainer 1개를 공유하므로(IntegrationTestSupport) 클래스 간 데이터
    // 격리가 실행 순서에 의존하지 않아야 한다. `./gradlew test -PrandomTestOrder` 로 클래스 순서를
    // 무작위로 섞어 그 전제를 검증한다. (S15P11B209-391 Phase 3)
    // 평소 빌드는 결정적 순서를 유지한다 — CI가 무작위로 초록/빨강을 오가면 안 되므로 옵트인이다.
    if (project.hasProperty('randomTestOrder')) {
        systemProperty 'junit.jupiter.testclass.order.default',
                'org.junit.jupiter.api.ClassOrderer$Random'
    }

    // 테스트 JVM 시간대를 운영·CI와 같은 UTC로 고정한다.
    // 운영 파드와 backend/Dockerfile 은 TZ 를 주지 않아 JVM 기본 시간대가 UTC 다
    // (infra/k8s/base/cronjobs.yaml:145 가 "컨테이너의 date 는 여전히 UTC 다"로 명시).
    // 반면 개발 PC 는 보통 Asia/Seoul 이다. JDBC 드라이버가 instant 기반 값(java.sql.Timestamp —
    // Hibernate 가 LocalDateTime 필드를 이걸로 주고받는다)을 JVM 기본 시간대 ↔ 세션 시간대(+09:00)로
    // 변환하므로, 시각을 다루는 테스트가 로컬에서만 통과하고 CI 에서 9시간 어긋날 수 있다.
    // 실제로 S15P11B209-822 의 NotificationIntegrationTest 2건이 그렇게 develop CI 를 깨뜨렸다 —
    // 로컬에서는 변환이 항등이어서 false green 이었다.
    // 고정해 두면 그 계열의 어긋남이 CI 가 아니라 로컬에서 먼저 드러난다.
    // 다른 시간대를 의도적으로 재현할 때만 `-PtestTimeZone=Asia/Seoul` 로 덮어쓴다.
    systemProperty 'user.timezone', project.findProperty('testTimeZone') ?: 'UTC'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    failOnError = true
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', 'src/**/*.yml', 'src/**/*.yaml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
