# 도담(dodam) — 이미지 **빌드 전용** compose (S15P11B209-791)
#
# ★ 이 파일은 이미지를 굽기만 한다. 운영 서비스를 띄우는 정의가 없고, 앞으로도 넣지 않는다.
#   운영 워크로드는 전부 k3s `dodam` 네임스페이스 소관이다(2026-07-29 컷오버 · S15P11B209-360).
#   여기에 `ports`·`volumes`·`networks`·`environment` 를 다시 넣고 싶어지면, 그건 k8s 매니페스트
#   (`infra/k8s/`)에 넣어야 할 것을 잘못 찾아온 것이다.
#
# ⚠️ 왜 실행 정의를 걷어냈나 (원래 `infra/docker-compose.yml`, 525줄)
#   컷오버 뒤에도 redis·mysql·minio·minio-init·backend·ai·web·nginx 의 **실행** 정의가 통째로
#   남아 있었다. 그런데 이 파일을 쓰는 곳은 Jenkinsfile 의 `docker compose build` 한 줄뿐이고,
#   나머지는 전부 죽은 정의였다. 죽은 채로 두는 것이 위험한 이유:
#
#     · `docker compose up -d` 한 줄이면 compose nginx 가 떠서 hostPort 80/443 을 k8s gateway 와
#       다툰다. CNI portmap DNAT 경로라 **깨끗한 bind 에러가 아니라 조용한 이상 동작**이 된다.
#       (Jenkinsfile 이 같은 이유로 이미 `compose up -d` 를 배포 경로에서 걷어냈다)
#     · mysql·minio 가 뜨면 k3s PVC 가 아니라 **빈 도커 볼륨**을 물고 올라온다.
#       아동 그림·음성이 사라진 것처럼 보이는 종류의 사고다(CLAUDE.md 9절 가드레일).
#
#   "주의하면 되는 일"로 두지 않고 정의 자체를 없앤다. 파일명도 의도가 드러나게 바꿨다.
#
# 사용 (repo 루트에서):
#   docker compose -f infra/docker-compose.build.yml --env-file infra/.env build
#
# 이 파일이 .env 에서 읽는 값은 **web 의 빌드 인자 4개뿐**이다(아래 web 주석 참조).
# 실행용 키(DB 비밀번호·GMS 키·FCM 자격증명 등)는 전부 k8s Secret/ConfigMap 이 소유한다.
#
# ── 옮겨간 것 ────────────────────────────────────────────────────────────────
#   실행 정의(redis·mysql·minio·backend·ai·web·nginx)  → infra/k8s/base/*.yaml
#   TLS 인증서 갱신(certbot)                            → k8s CronJob `certbot-renew` (746)
#   MinIO 프로비저닝(minio-init)                        → 아래 "프로비저닝" 주석 참조
#
# ── 프로비저닝(minio-init)은 왜 여기 없나 ────────────────────────────────────
#   `minio-init` 은 `profiles: ["init"]` 이라 애초에 `docker compose build` 대상이 아니었고,
#   compose 의 `minio` 서비스와 `dodam-net` 네트워크에 의존했다 — 둘 다 컷오버로 사라졌으므로
#   **k3s 의 MinIO 에는 애초에 닿지 못한다.** 즉 이미 동작하지 않는 정의였다.
#   프로비저닝 자산(`init.sh`·`policies/`·`lifecycle.json`·`Dockerfile`)은 `infra/minio/` 에
#   그대로 있다. 다시 필요해지면(MinIO 재생성·정책 변경) 그 이미지를 **k8s Job** 으로 돌릴 것.
#   compose 로 되살리지 말 것 — 위 "왜 걷어냈나"와 같은 경로다.
# ─────────────────────────────────────────────────────────────────────────────

# 프로젝트 이름 고정 — 빌드 라벨(com.docker.compose.project)이 실행 위치에 따라 갈리지 않게 한다.
name: dodam

services:
  # backend — Spring Boot(Java 21). 배포 이미지: 127.0.0.1:5000/dodam-backend
  backend:
    build:
      context: ../backend        # 빌드 컨텍스트 = 리포지토리 backend/ (이 파일 위치 기준 상대경로)
      dockerfile: Dockerfile
    image: dodam-backend:local   # Jenkins 가 :<SHA> · :prod 로 태그해 로컬 레지스트리에 푸시한다

  # ai — FastAPI(Python). 배포 이미지: 127.0.0.1:5000/dodam-ai
  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    image: dodam-ai:local

  # web — Next.js. 배포 이미지: 127.0.0.1:5000/dodam-web
  #
  # ⚠️ 아래 4개는 **빌드 시점에 JS 번들로 구워진다.** 런타임 주입이 아니라서, 값이 비면
  #   빌드는 조용히 성공하고 브라우저에서 소셜 로그인만 깨진다(S15P11B209-817 계열).
  #   `:-` 기본값이라 누락돼도 빌드가 서지 않는다는 뜻이다 — 값이 실제로 들어갔는지는
  #   배포 후 **JS 번들 실물**로 확인할 것(서버렌더 HTML 만 보면 알 수 없다).
  #   ※ `:?` 가드로 올리는 안은 보류했다. Jenkins 크리덴셜 `dodam-env` 의 현재 값을 확인하지
  #     못한 상태에서 올리면 791 과 무관한 이유로 CI 가 서기 때문이다. 별건으로 판단할 것.
  web:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_KAKAO_CLIENT_ID: ${NEXT_PUBLIC_KAKAO_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NEXT_PUBLIC_NAVER_CLIENT_ID:-}
    image: dodam-web:local

  # nginx — 게이트웨이 이미지. conf 를 이미지에 COPY 하므로 컨텍스트에 conf.d 가 포함된다.
  #   배포 이미지: 127.0.0.1:5000/dodam-nginx (k8s Deployment 이름은 `gateway`, 컨테이너는 `nginx`)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: dodam-nginx:local
