# 도담(dodam) Prometheus 스크레이프 설정 — S15P11B209-352
# 대상 5종: backend(Spring actuator) · ai(FastAPI) · node-exporter(호스트) · cadvisor(컨테이너) · prometheus 자신
# ⚠️ backend·ai 는 기존 스택 내부망(dodam_dodam-net)의 서비스 DNS(backend·ai)로 접근
#    — docker-compose.yml에서 prometheus가 external 네트워크(dodam-net)에 참여하고 있어야 해석된다.

global:
  scrape_interval: 15s        # 수집 주기 — 대시보드 용도로 충분(과투자 금지, k3s 이전 시 재평가)
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot backend — management 포트 9404, micrometer prometheus 레지스트리.
  #   (2026-07-23 내부망 무인증 200 실측 — 9404는 호스트 미개방·내부망 전용이라 무인증 허용.
  #    ⚠️ 9404를 호스트/nginx로 노출하는 순간 이 전제가 깨짐 — 절대 노출 금지)
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9404"]

  # FastAPI ai — /metrics (기본 경로지만 명시 — backend와 대비를 위해)
  - job_name: ai
    metrics_path: /metrics
    static_configs:
      - targets: ["ai:8000"]

  # EC2 호스트 메트릭
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # 컨테이너별 리소스 메트릭
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # MinIO 오브젝트 스토리지 — 아동 그림·음성 파일 저장소 (S15P11B209-369)
  #   무인증 스크레이프는 compose 의 MINIO_PROMETHEUS_AUTH_TYPE=public 에 의존한다.
  #   그 값이 없으면 403 이 되므로, 타깃이 down 이면 그 환경변수부터 확인할 것.
  #   경로는 v2 cluster — 버킷 단위 지표가 필요해지면 /minio/v2/metrics/bucket 을 추가한다
  #   (버킷 지표는 객체 수가 늘수록 수집 비용이 커져 기본에서는 제외).
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # 수집기 자신 — 수집기 장애를 수집기로 관찰
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
