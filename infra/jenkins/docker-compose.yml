# 도담 CI/CD — Jenkins 컨트롤러 (이 EC2에 단독 운영; 앱 스택과 분리된 compose 프로젝트)
# 관련 이슈: S15P11B209-189 (Jenkins CI/CD)
#
# 실행 (repo 루트에서):
#   docker compose -f infra/jenkins/docker-compose.yml up -d --build
# 초기 관리자 암호 확인:
#   docker exec dodam-jenkins cat /var/jenkins_home/secrets/initialAdminPassword
# UI 접속(외부 미노출 → SSH 터널):
#   ssh -L 9090:localhost:9090 <ec2>   후 브라우저에서 http://localhost:9090

# 앱 스택(name: dodam)과 분리 — Jenkins는 별도 프로젝트로 관리
name: dodam-cicd

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_GID: "988"          # 호스트 docker 그룹 GID (getent group docker 로 확인)
    image: dodam-jenkins:local
    container_name: dodam-jenkins
    restart: unless-stopped

    # ★ 이 서버에서 가장 큰 메모리 소비자 (S15P11B209-356 — 07-28 호스트 OOM 대응).
    #   07-28 실측: 빌드 중 단독 4,571MB. 상한이 없어 폭주하면 호스트 전체를 끌고 간다.
    #   6g = 실측 피크(4.5g) + 33% 여유. 더 줄이면 정상 빌드가 죽고, 더 늘리면 상한의 의미가 없다.
    #   ⚠️ Testcontainers 가 띄우는 MySQL(개당 약 330MB)은 **호스트 도커에 직접** 뜨므로
    #      이 상한 밖이다. 빌드 1회의 실제 호스트 점유는 6g + (0.33g × 컨테이너 수).
    mem_limit: 6g

    volumes:
      - jenkins-home:/var/jenkins_home              # 설정·잡·플러그인·자격증명 영속화(반드시 볼륨)
      # ⚠️ 호스트 docker 소켓 마운트 = 이 컨테이너에 사실상 호스트 root급 권한.
      #    → Jenkins UI는 반드시 (a) 인증 활성 (b) 로컬 바인딩(아래 ports)으로만 접근하게 보호.
      - /var/run/docker.sock:/var/run/docker.sock   # 이미지 빌드·compose 배포용

    # nginx 프록시(/jenkins) 뒤 서브패스로 동작 — 외부 접근: https://i15b209.p.ssafy.io/jenkins/
    environment:
      JENKINS_OPTS: "--prefix=/jenkins"
      # ── 컨트롤러 JVM 힙 상한 (S15P11B209-356 · 07-28 호스트 OOM 대응)
      #   상한을 안 주면 JVM 은 호스트 RAM 의 25%(=약 3.9GB)까지 힙을 키운다.
      #   07-28 실측 4,571MB 의 대부분이 이 힙이다 — mem_limit 만으로는 "상한 직전까지 부풀었다가
      #   컨테이너째 죽는" 형태가 되므로, 힙 자체를 먼저 묶는다.
      #   2g = 잡 수십 개 규모에 충분. 빌드 실체(gradle·docker build)는 별도 컨테이너에서 돈다.
      #   ⚠️ "Jenkins 가 느리다"의 원인이 GC 라면 이 값을 올릴 것 — mem_limit(6g)과 함께 본다.
      JAVA_OPTS: "-Xmx2g -XX:MaxRAMPercentage=40.0"

    ports:
      # 호스트 직접 바인딩은 여전히 로컬만(비상용 터널 경로) → UFW 80/443 정책 유지.
      # ⚠️ prefix 적용 후 터널 접속 주소는 http://localhost:9090/jenkins/ (루트 아님).
      - "127.0.0.1:9090:8080"       # Jenkins 웹 UI (호스트 9090 → 컨테이너 8080)
      # 50000(에이전트 포트)은 컨트롤러 인-빌드라 미개방.

    # Jenkins 기동 완료(로그인 페이지 응답) 여부 — 이미지에 설치한 curl 사용
    healthcheck:
      # prefix(/jenkins) 적용에 맞춘 경로 — 구경로 /login은 404가 정상이라 헬스체크가 오탐한다
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/jenkins/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s             # 최초 기동(플러그인 로딩)에 여유

    networks:
      - dodam-cicd-net
      - dodam-net                   # 앱 nginx가 'dodam-jenkins:8080'으로 프록시하기 위해 앱 내부망에도 참여

  # ── 로컬 이미지 레지스트리 (S15P11B209-356 · k3s 전환 준비) ──────────────────
  # 왜 필요한가: 지금 파이프라인은 이미지를 호스트 **Docker 데몬 안에만** 둔다
  #   (dodam-backend:local → :<SHA>, push 없음). k3s 는 Docker 가 아니라
  #   **containerd** 를 쓰고 둘은 이미지 저장소가 완전히 별개다 — k3s 는 Docker 의
  #   이미지를 볼 수 없다. 그래서 둘이 함께 볼 수 있는 레지스트리를 중간에 둔다.
  #     Jenkins → docker push 127.0.0.1:5000/... → k3s(containerd) → pull
  #
  # ⚠️ k3s 쪽에는 infra/k3s/registries.yaml 을 /etc/rancher/k3s/ 에 배치해야 한다.
  #    Docker 는 loopback 을 기본 insecure registry 로 취급해 별도 설정이 필요 없다.
  #    한쪽만 보고 "설정 끝"이라 판단하지 말 것.
  registry:
    image: registry:2.8.3           # latest 금지 — 컷오버 중 조용한 동작 변경을 막는다
    container_name: dodam-registry
    restart: unless-stopped

    ports:
      # ⚠️ 반드시 127.0.0.1 바인딩. 평문 HTTP 라서 외부에 열리면 누구나 이미지를
      #    올리고 내릴 수 있다 = 배포 파이프라인 장악. UFW 에 의존하지 말고 여기서 막는다.
      - "127.0.0.1:5000:5000"

    environment:
      # 삭제 API 활성 — 태그가 SHA 단위로 쌓이므로 정리 수단이 없으면 디스크가 찬다.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

    volumes:
      - registry-data:/var/lib/registry

    # 이 서버는 메모리 여유가 크지 않다(2026-07-28 실측: available 4.4GB, swap 2GB 사용 중).
    # 레지스트리가 커널 페이지 캐시를 밀어내지 않도록 상한을 둔다.
    mem_limit: 512m

    # healthcheck 는 두지 않았다. registry:2.8.3 이미지에 curl/wget 이 들어 있는지
    # 이 세션에서 확인하지 못했고, 없는 명령으로 헬스체크를 걸면 "설정은 있는데
    # 동작하지 않는" 상태가 된다. 대신 호스트에서 확인한다:
    #   curl -fsS http://127.0.0.1:5000/v2/   → 빈 JSON {} 이면 정상
    # 이미지에 실제로 무엇이 들어 있는지 확인한 뒤 healthcheck 를 추가할 것.

    networks:
      - dodam-cicd-net

networks:
  dodam-cicd-net:
    driver: bridge
  dodam-net:                        # 앱 스택(infra/docker-compose.yml)의 네트워크 — 외부 참조
    external: true
    name: dodam_dodam-net

# Jenkins 홈(모든 설정·자격증명·빌드 이력) — 컨테이너 재생성해도 유지
volumes:
  jenkins-home:
  registry-data:      # 빌드 이미지 레이어. 커밋 SHA 태그가 계속 쌓이므로 주기적 정리 필요(356 runbook)
