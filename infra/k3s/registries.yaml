# ============================================================================
# k3s 컨테이너 런타임(containerd)이 사설 레지스트리를 찾는 설정 (S15P11B209-356)
#
# 배치 위치: /etc/rancher/k3s/registries.yaml  (이 파일을 root 소유 644 로 복사)
# 적용:      sudo systemctl restart k3s        ← k3s 재시작이 있어야 반영된다
#
# 왜 필요한가 — 이게 핵심이다:
#   지금 Jenkins 파이프라인은 이미지를 만들어 **호스트 Docker 데몬 안에만** 둔다
#   (dodam-backend:local → :<SHA> 태그, push 없음). 그런데 k3s 는 Docker 가 아니라
#   **containerd** 를 쓴다. 둘은 이미지 저장소가 완전히 별개라서,
#   k3s 는 Docker 가 가진 이미지를 볼 수 없다. → 중간에 레지스트리가 필요하다.
#
#      Jenkins → docker build → docker push 127.0.0.1:5000/... → k3s(containerd) → pull
#
# 왜 HTTP(평문)인가:
#   127.0.0.1 로만 바인딩된 같은 호스트 안의 레지스트리라 네트워크를 타지 않는다.
#   TLS 인증서 발급·갱신 비용을 감수할 이유가 없다. 단, 이 전제가 깨지는 순간
#   (외부 바인딩·다른 노드 추가) 이 설정은 즉시 위험해진다 — 그때는 TLS 로 바꾼다.
#
# ⚠️ Docker 는 이 파일이 필요 없다. Docker 데몬은 loopback 주소를 기본적으로
#    insecure registry 로 취급해서 daemon.json 수정 없이 push 가 된다.
#    설정이 필요한 쪽은 containerd 뿐이다 — 한쪽만 보고 "설정 끝"이라 판단하지 말 것.
# ============================================================================
mirrors:
  "127.0.0.1:5000":
    endpoint:
      - "http://127.0.0.1:5000"
