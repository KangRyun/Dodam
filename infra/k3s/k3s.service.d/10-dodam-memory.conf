# k3s 메모리 가드 — systemd drop-in (S15P11B209-356)
#
# 배치 (k3s 설치 **후**, root 필요):
#   sudo mkdir -p /etc/systemd/system/k3s.service.d
#   sudo cp infra/k3s/k3s.service.d/10-dodam-memory.conf /etc/systemd/system/k3s.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart k3s
#
# 왜 필요한가 — 2026-07-28 사고
#   이 서버는 k3s **전용이 아니다.** docker compose 운영 스택(backend·mysql·minio·nginx…)과
#   Jenkins 가 같은 15.6GB 를 나눠 쓴다. k3s 는 자기 밖의 사용량을 모르기 때문에,
#   가만히 두면 "호스트에 메모리가 남아 있다"고 판단하고 계속 파드를 받는다.
#   그 결과가 07-28 의 호스트 응답 불능이다.
#
#   여기서 거는 것은 두 가지뿐이다:
#     - k3s 가 쓸 수 있는 총량에 **부드러운** 상한
#     - 메모리가 마를 때 **k3s 가 먼저 죽도록** 우선순위 조정
#   파드 단위 상한은 kubelet 플래그(runbook 2단계)와 매니페스트의 resources.limits 가 맡는다.

[Service]
# 부드러운 상한. 넘으면 커널이 이 cgroup 을 집중 회수한다 — 죽이지는 않는다.
#   reason: MemoryMax(하드 상한)를 쓰면 한계에서 파드가 통째로 OOM-kill 되어
#   "왜 죽었는지 모르는" 장애가 된다. 먼저 느려지게 만들어 관측 기회를 준다.
#   358(스테이징: 앱 사본 1벌)까지는 4G 로 충분하다. 워크로드가 늘면 여기부터 조정.
MemoryHigh=4G

# 진짜 한계선. 여기서는 죽인다 — 단, 호스트가 굳는 것보다는 낫다는 판단이다.
#   MemoryHigh 와 간격을 둬(4G→6G) 회수로 버틸 구간을 먼저 준다.
MemoryMax=6G

# 메모리 고갈 시 커널 OOM 킬러가 k3s 를 **먼저** 고르게 한다 (기본 0, 범위 -1000~1000).
#   reason: 이 서버의 우선순위는 명확하다 — 운영 스택(mysqld·backend·nginx) > k3s(실험).
#   k3s 가 죽으면 다시 띄우면 되지만, mysqld 가 죽으면 아동 데이터를 쥔 채로 죽는다.
OOMScoreAdjust=200

# 죽었을 때 되살아나되, 즉시 재시작으로 메모리 압박을 되풀이하지 않게 간격을 둔다.
Restart=always
RestartSec=15s
