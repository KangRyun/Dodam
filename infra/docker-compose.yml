# 도담(dodam) 배포 스택 — MySQL 8.0 서비스
# 관련 이슈: S15P11B209-184(MySQL 컨테이너) · S15P11B209-185(compose 골격) · S15P11B209-186(.env) · S15P11B209-188(ai 서비스)
#
# 실행 (repo 루트에서):
#   docker compose -f infra/docker-compose.yml --env-file .env up -d mysql
#   docker compose -f infra/docker-compose.yml ps
#
# 원칙:
#   - 비밀번호/키는 .env 참조(${...})만. .env 는 커밋 금지(.gitignore 등록됨).
#   - version: 키는 Compose v2에서 불필요(obsolete)라 생략.

# 프로젝트 이름 고정 — 실행 위치(cwd)와 무관하게 컨테이너/볼륨 이름을 'dodam_*'로 통일.
#   (이게 없으면 infra/에서 돌릴 때 'infra_mysql-data', 루트에서 돌릴 때 다른 이름이 생겨 볼륨이 갈림)
name: dodam

services:
  mysql:
    image: mysql:8.0.40            # latest 금지 — 재현성 위해 패치 버전 고정 (원하면 최신 8.0.x로 상향)
    container_name: dodam-mysql
    restart: unless-stopped

    # 컨테이너 최초 기동 시 DB/계정을 만드는 초기화 변수 — 값은 .env에서 주입(이 파일엔 값 없음)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 관리자 비번 (앱은 이 계정으로 접속하지 않음)
      MYSQL_DATABASE: ${MYSQL_DATABASE}             # 최초 생성할 DB 이름 (= b209)
      MYSQL_USER: ${MYSQL_USER}                     # 앱 전용 일반 계정 (최소권한)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}             # 앱 계정 비번

    # 한글(아동 대화/그림 설명 등) 깨짐 없이 저장 — utf8mb4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    # 데이터 영속화 — 네임드 볼륨. 컨테이너를 지우고 다시 만들어도 DB 데이터는 유지됨
    volumes:
      - mysql-data:/var/lib/mysql

    # ⚠️ ports 를 열지 않는다 — 아동 민감정보 DB의 외부 노출면 = 0.
    #    backend 컨테이너는 아래 내부 네트워크(dodam-net)를 통해 'mysql:3306'으로 접근한다.
    #    호스트에서 직접 확인이 필요하면:  docker exec -it dodam-mysql mysql -u root -p
    # ports:
    #   - "3306:3306"   # ← 절대 열지 말 것(가드레일). 불가피하면 "127.0.0.1:3306:3306"로 로컬만.

    # 기동 완료(접속 가능) 여부 판단 — 나중에 backend가 depends_on(condition: service_healthy)로 이걸 기다림
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s     # mysql 최초 init(DB/계정 생성)에 시간이 걸리므로 여유

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # backend — Spring Boot(Java 21). 내부망 전용(호스트 포트 미개방), 외부 진입은 nginx로만.
  # ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend        # 빌드 컨텍스트 = 리포지토리 backend/ (compose 파일 위치 기준 상대경로)
      dockerfile: Dockerfile     # backend/Dockerfile (아래 별도 파일)
    image: dodam-backend:local   # 로컬 빌드 이미지 이름. CI 도입 시 레지스트리 태그로 대체
    container_name: dodam-backend
    restart: unless-stopped

    environment:
      # 스프링 프로파일 주입. 값이 없으면 local (application.yml의 default와 동일)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # DB 접속 정보 — backend는 시작 시 Flyway가 DB에 연결하므로 필수.
      #   ⚠️ 컨테이너 안에서 DB_HOST는 반드시 내부망 DNS 'mysql' (localhost/127.0.0.1은 자기 자신 = 접속 불가).
      #   계정/DB명은 mysql 서비스 초기화 변수(MYSQL_*)와 동일 소스(.env)를 참조해 불일치를 원천 차단.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}       # = mysql 서비스의 MYSQL_DATABASE (b209)
      DB_USERNAME: ${MYSQL_USER}       # = 앱 전용 최소권한 계정 (root 아님)
      DB_PASSWORD: ${MYSQL_PASSWORD}

    # ⚠️ ports 를 열지 않는다 — 호스트엔 노출 안 함. 내부망(dodam-net)에서 'backend:8080'으로만 접근.
    expose:
      - "8080"                   # 문서화 목적(같은 네트워크의 nginx가 이 포트로 프록시)

    # DB가 healthy 된 뒤 기동. (지금 backend는 DB 미사용이나, JPA 도입 대비 순서 보장)
    depends_on:
      mysql:
        condition: service_healthy

    # actuator가 없어 HTTP 헬스체크 불가 → 8080 리슨 여부만 TCP로 확인 (jre-jammy에 bash 존재)
    #   더 정확한 헬스체크를 원하면 actuator 추가 후 /actuator/health 로 교체 (리뷰 포인트)
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s          # 스프링 부팅 여유

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # ai — 도담 AI 분석 서버(FastAPI, Python). 내부망 전용. 대화 LLM·STT·TTS를 GMS로 호출.
  #      ⚠️ 아동 음성/발화가 지나가는 서비스 → 호스트 포트 미개방, 외부 진입은 nginx /ai 로만.
  # ───────────────────────────────────────────────────────────────
  ai:
    build:
      context: ../ai             # 빌드 컨텍스트 = 리포지토리 ai/ (compose 파일 위치 기준 상대경로)
      dockerfile: Dockerfile     # ai/Dockerfile
    image: dodam-ai:local        # 로컬 빌드 이미지 이름. CI 도입 시 레지스트리 태그로 대체
    container_name: dodam-ai
    restart: unless-stopped

    # GMS 접속·모델 설정을 .env에서 주입(이 파일엔 값 없음). ai가 필요로 하는 키만 선별 주입(최소권한).
    #   ⚠️ GMS_KEY 는 비밀 — 절대 하드코딩·로그 금지. 값은 .env 에만 존재.
    environment:
      GMS_KEY: ${GMS_KEY}                        # GMS(OpenAI 호환) 인증 키 — 필수, 기본값 없음
      GMS_BASE_URL: ${GMS_BASE_URL}              # GMS 프록시 엔드포인트
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}       # 대화 LLM
      STT_MODEL: ${STT_MODEL:-whisper-1}         # 음성→텍스트
      TTS_MODEL: ${TTS_MODEL:-gpt-4o-mini-tts}   # 텍스트→음성(지시형)
      TTS_VOICE: ${TTS_VOICE:-fable}             # 곰돌이 톤 보이스

    # ⚠️ ports 를 열지 않는다 — 호스트엔 노출 안 함. 내부망(dodam-net)에서 'ai:8000'으로만 접근.
    expose:
      - "8000"                   # 문서화 목적(같은 네트워크의 nginx가 이 포트로 프록시)

    # /health 로 기동 완료 판단. slim 이미지엔 curl이 없어 python stdlib(urllib)로 확인.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s          # 앱 import(openai·pydantic 로딩)에 1~2초 걸림 → 여유
    # NOTE: ai 는 mysql을 쓰지 않으므로 depends_on 없음(GMS만 호출). backend와 독립 기동.

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # nginx — 리버스 프록시. ★ 유일하게 외부(호스트)로 열리는 서비스. (EC2 UFW도 80/443만 허용)
  # ───────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx           # 빌드 컨텍스트 = infra/nginx (conf.d 포함 — Dockerfile이 이미지에 COPY)
      dockerfile: Dockerfile
    image: dodam-nginx:local     # 로컬 빌드 이미지 — conf 내장. 베이스는 nginx:1.27-alpine(버전 고정)
    container_name: dodam-nginx
    restart: unless-stopped

    ports:
      - "80:80"                  # ACME 챌린지 + https 리다이렉트 전용
      - "443:443"                # 실서비스 진입점(TLS 종단) — S15P11B209-301

    # ⚠️ conf 를 bind 마운트하지 않는다 — 실행 위치(호스트/Jenkins)에 따라 경로가 달라져
    #    빈 conf 가 마운트되는 사고(2026-07-22)가 있었음. conf 는 이미지에 bake(위 build 참조).
    #    conf 변경 → 커밋 → 파이프라인이 이미지 재빌드 + 컨테이너 재생성으로 반영.
    # 인증서·ACME 챌린지는 "네임드 볼륨"이라 실행 위치와 무관(bind 아님) + 저장소에 인증서 커밋 금지(가드레일).
    volumes:
      - letsencrypt:/etc/letsencrypt:ro         # 인증서 읽기(발급·갱신은 certbot이 씀)
      - certbot-webroot:/var/www/certbot:ro     # ACME 챌린지 토큰 서빙용

    depends_on:
      backend:
        condition: service_healthy   # backend가 뜬 뒤 프록시 시작
      ai:
        condition: service_started   # ai 컨테이너 '시작'만 보장(=nginx가 'ai' 호스트를 해석 가능). health엔 안 묶음 → ai 장애가 게이트웨이(/api)까지 막지 않게. (초기 /ai 는 일시 502 가능)

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # certbot — Let's Encrypt 인증서 자동 갱신 (S15P11B209-301).
  #   12시간마다 renew 시도(실제 갱신은 만료 30일 전부터만 일어남 — 그 외엔 no-op).
  #   최초 발급은 1회 수동 — ⚠️ 이 서비스는 entrypoint가 갱신 루프라 --entrypoint 덮어쓰기 필수:
  #   docker compose -f infra/docker-compose.yml run --rm --entrypoint certbot certbot \
  #     certonly --webroot -w /var/www/certbot -d i15b209.p.ssafy.io --email <이메일> --agree-tos --no-eff-email
  #   (내부망 불필요 — LE와의 통신은 아웃바운드, 챌린지 서빙은 nginx가 담당. 2026-07-22 발급 완료)
  # ───────────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:v2.11.0   # latest 금지 — 버전 고정
    container_name: dodam-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt            # 인증서 저장(쓰기)
      - certbot-webroot:/var/www/certbot        # 챌린지 토큰 쓰기(nginx가 서빙)
    # 갱신 루프 — 인증서가 없으면 "갱신 대상 없음"으로 조용히 지나감(안전)
    entrypoint: sh -c 'trap exit TERM; while true; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done'

# 내부 전용 네트워크 — mysql·backend·ai·nginx가 여기 붙는다. 외부 노출은 nginx만.
networks:
  dodam-net:
    driver: bridge

# 네임드 볼륨 — mysql 데이터 · TLS 인증서 · ACME 챌린지
volumes:
  mysql-data:
  letsencrypt:        # /etc/letsencrypt (인증서·계정) — 컨테이너 재생성에도 유지, 저장소 비추적
  certbot-webroot:    # ACME HTTP-01 챌린지 토큰 교환용 (certbot 씀 ↔ nginx 서빙)
