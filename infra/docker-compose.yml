# 도담(dodam) 배포 스택 — MySQL 8.4 서비스
# 관련 이슈: S15P11B209-184(MySQL 컨테이너) · S15P11B209-185(compose 골격) · S15P11B209-186(.env) · S15P11B209-188(ai 서비스)
#
# 실행 (repo 루트에서):
#   docker compose -f infra/docker-compose.yml --env-file .env up -d mysql
#   docker compose -f infra/docker-compose.yml ps
#
# 원칙:
#   - 비밀번호/키는 .env 참조(${...})만. .env 는 커밋 금지(.gitignore 등록됨).
#   - version: 키는 Compose v2에서 불필요(obsolete)라 생략.

# 프로젝트 이름 고정 — 실행 위치(cwd)와 무관하게 컨테이너/볼륨 이름을 'dodam_*'로 통일.
#   (이게 없으면 infra/에서 돌릴 때 'infra_mysql-data', 루트에서 돌릴 때 다른 이름이 생겨 볼륨이 갈림)
name: dodam

services:
  redis:
    image: redis:7.4.8-alpine    # 기술스택 문서(7.4.8) 정렬 — S15P11B209-321. latest 금지, 패치 버전 고정
    container_name: dodam-redis
    restart: unless-stopped
    mem_limit: 1g                  # S15P11B209-356 — 07-28 호스트 OOM 대응(예산표: docs/인프라/메모리-OOM-대응.md)
                                   #   reason: 실사용 약 13MB. maxmemory 를 걸지 않아 이론상 무한 증가가 가능해
                                   #   상한만 둔다. 정책(eviction)은 건드리지 않는다 — allkeys-lru 로 바꾸면
                                   #   리프레시 토큰이 조용히 증발해 사용자가 로그아웃된다.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be configured in .env or deployment secrets}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dodam-net

  mysql:
    image: mysql:8.4.10            # 8.4 LTS — 기술스택 문서·Testcontainers(테스트=운영) 정렬. S15P11B209-321
                                   #   ⚠️ 8.0→8.4 데이터 디렉토리 자동 업그레이드는 "비가역"(다운그레이드 불가).
                                   #   롤백 수단은 사전 mysqldump 복원뿐 — 배포 전 백업이 관문. latest 금지, 패치 버전 고정.
    container_name: dodam-mysql
    restart: unless-stopped
    mem_limit: 2g                  # S15P11B209-356 — 07-28 호스트 OOM 대응
                                   #   reason: 실사용 약 490MB(innodb_buffer_pool 기본 128MB). 4배 여유.
                                   #   ⚠️ 이 값을 줄일 때는 buffer_pool 설정을 먼저 볼 것 — 상한이 buffer_pool
                                   #   보다 작으면 기동 직후 OOM-kill 되고, 아동 데이터를 쥔 채 죽는다.

    # 컨테이너 최초 기동 시 DB/계정을 만드는 초기화 변수 — 값은 .env에서 주입(이 파일엔 값 없음)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 관리자 비번 (앱은 이 계정으로 접속하지 않음)
      MYSQL_DATABASE: ${MYSQL_DATABASE}             # 최초 생성할 DB 이름 (= b209)
      MYSQL_USER: ${MYSQL_USER}                     # 앱 전용 일반 계정 (최소권한)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}             # 앱 계정 비번

    # 한글(아동 대화/그림 설명 등) 깨짐 없이 저장 — utf8mb4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    # 데이터 영속화 — 네임드 볼륨. 컨테이너를 지우고 다시 만들어도 DB 데이터는 유지됨
    volumes:
      - mysql-data:/var/lib/mysql

    # ⚠️ ports 를 열지 않는다 — 아동 민감정보 DB의 외부 노출면 = 0.
    #    backend 컨테이너는 아래 내부 네트워크(dodam-net)를 통해 'mysql:3306'으로 접근한다.
    #    호스트에서 직접 확인이 필요하면:  docker exec -it dodam-mysql mysql -u root -p
    # ports:
    #   - "3306:3306"   # ← 절대 열지 말 것(가드레일). 불가피하면 "127.0.0.1:3306:3306"로 로컬만.

    # 기동 완료(접속 가능) 여부 판단 — 나중에 backend가 depends_on(condition: service_healthy)로 이걸 기다림
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s     # mysql 최초 init(DB/계정 생성)에 시간이 걸리므로 여유

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # minio — 오브젝트 스토리지(S3 호환). 아동 그림·음성 등 파일 저장. 내부망 전용.
  #   현재 backend-storage(로컬 볼륨) 대체. 단일 버킷 dodam + 프리픽스 5종.
  #   설계: docs/database/저장소-아키텍처.md · S15P11B209-620.
  #   ⚠️ 첫 기동 시 검증(리눅스 세션에서 실행 불가): ① 이미지 태그 실존 ② healthcheck 명령 ③ mc 정책 명령 버전.
  # ───────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z   # latest 금지 — 실존하는 안정 태그로 확인·교체
    container_name: dodam-minio
    restart: unless-stopped

    # reason: 공용 15GB EC2 — 저장소가 앱 메모리를 침범하지 않게 상한을 둔다
    #   (docs/database/저장소-아키텍처.md §2 "limits 없는 파드 금지").
    #   MinIO는 객체 캐시로 여유 메모리를 계속 흡수하는 성격이라 상한이 특히 필요하다.
    #   실측 사용량 약 225MB(2026-07-28, 객체 40개) → 1g 는 충분한 여유.
    #   ⚠️ 이 값이 적용되려면 컨테이너 재생성이 필요하다(재시작만으로는 안 바뀐다).
    mem_limit: 1g
    cpus: 1.0

    # 프로비저닝 전용 관리자(root) — 앱은 이 계정으로 접속하지 않음. 값은 .env에서 주입(이 파일엔 값 없음).
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Prometheus 메트릭 무인증 허용 (S15P11B209-369).
      #   reason: 기본값(jwt)이면 /minio/v2/metrics/* 가 403 — 실측 확인(2026-07-28).
      #   토큰 방식은 만료·재발급 운영 부담이 있어, backend 9404 와 동일한 전제를 적용한다:
      #   "호스트 미개방 + nginx 미프록시 = 내부망 전용이므로 무인증 허용".
      #   ⚠️ 이 전제는 9000 을 외부로 노출하는 순간 깨진다 — ports 를 열지 말 것.
      #   S3 API 자체의 인증에는 영향이 없다(메트릭 경로만 공개).
      MINIO_PROMETHEUS_AUTH_TYPE: public

    # 9000=S3 API, 9001=콘솔. 데이터는 /data(네임드 볼륨).
    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

    # ⚠️ ports 미개방 — 아동 파일 저장소 외부 노출면 = 0 (mysql과 동일 가드레일).
    #    backend는 dodam-net으로 'minio:9000'(S3 API) 접근. 콘솔(9001)도 미노출.
    #    콘솔 관리가 필요하면 SSH 터널:  ssh -L 9001:<minio-container-ip>:9001 kr@i15b209.p.ssafy.io
    # ports:
    #   - "9000:9000"   # ← 절대 열지 말 것. 불가피하면 "127.0.0.1:9001:9001"(콘솔만 로컬).

    healthcheck:
      # ⚠️ minio 이미지에 curl 유무는 첫 기동 시 확인. 없으면 mc 사이드카·다른 명령으로 조정.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # minio-init — 1회성 프로비저닝. 버킷 dodam·프리픽스·최소권한 계정 2벌 생성 후 종료.
  #   be-rw(버킷 rw) / ai-ro(images/ 읽기전용). 스크립트: infra/minio/init.sh
  #
  # ⚠️ 평시 배포에서는 뜨지 않는다(profiles: init) — 2026-07-26 장애 재발 방지.
  #   프로비저닝은 멱등한 1회성 작업인데, 이게 실패하면서 backend·nginx까지 막아
  #   서비스가 두 번 전면 중단됐다(빌드 191·192). 게이트웨이의 가용성을
  #   1회성 초기화 작업에 묶지 않는다.
  #
  # 실행이 필요할 때(최초 구축·MinIO 재생성·정책 변경)만 수동으로:
  #   docker compose --profile init build minio-init
  #   docker compose --profile init run --rm minio-init
  # ───────────────────────────────────────────────────────────────
  minio-init:
    # 스크립트·정책은 이미지에 bake — bind 마운트 금지(infra/minio/Dockerfile 주석의 DooD 경로 함정 참조)
    build:
      context: ./minio           # 빌드 컨텍스트는 tar 로 데몬에 전송 → 실행 위치(호스트/Jenkins) 무관
      dockerfile: Dockerfile
    image: dodam-minio-init:local
    container_name: dodam-minio-init
    profiles: ["init"]           # ← 기본 up -d 대상에서 제외. 위 수동 명령으로만 기동.
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BE_USER: ${MINIO_BE_USER}           # dodam-be-rw
      MINIO_BE_PASSWORD: ${MINIO_BE_PASSWORD}
      MINIO_AI_USER: ${MINIO_AI_USER}           # dodam-ai-ro
      MINIO_AI_PASSWORD: ${MINIO_AI_PASSWORD}
    # entrypoint·스크립트는 이미지에 내장(infra/minio/Dockerfile) — 여기서 마운트하지 않는다.
    networks:
      - dodam-net
    restart: "no"     # 1회성 — 프로비저닝 후 종료(정상적으로 Exited 0)

  # ───────────────────────────────────────────────────────────────
  # backend — Spring Boot(Java 21). 내부망 전용(호스트 포트 미개방), 외부 진입은 nginx로만.
  # ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend        # 빌드 컨텍스트 = 리포지토리 backend/ (compose 파일 위치 기준 상대경로)
      dockerfile: Dockerfile     # backend/Dockerfile (아래 별도 파일)
    image: dodam-backend:local   # 로컬 빌드 이미지 이름. CI 도입 시 레지스트리 태그로 대체
    container_name: dodam-backend
    restart: unless-stopped
    mem_limit: 3g                  # S15P11B209-356 — 07-28 호스트 OOM 대응
                                   #   reason: 실사용 약 730MB. JVM 은 상한이 없으면 호스트 RAM 의 25%
                                   #   (=약 3.9GB)까지 힙을 키운다 — 상한과 아래 MaxRAMPercentage 는 반드시 짝이다.

    environment:
      # 스프링 프로파일 주입. 값이 없으면 local (application.yml의 default와 동일)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # ── JVM 힙 상한 (S15P11B209-356 · 07-28 호스트 OOM 대응)
      #   JVM 은 cgroup 상한을 **기동 시점에 한 번** 읽어 MaxHeapSize 를 정한다.
      #   mem_limit 만 걸고 이 값을 안 주면 힙 상한(기본 25%)이 컨테이너 상한보다 커질 수 있고,
      #   그러면 GC 가 힙을 늘리는 순간 컨테이너가 통째로 OOM-kill 된다("메모리 늘렸는데 더 자주 죽는" 함정).
      #   60% = 3g 중 1.8g 힙. 나머지 1.2g 는 메타스페이스·스레드 스택·다이렉트 버퍼·코드캐시 몫.
      #   ⚠️ mem_limit 을 바꾸면 이 비율의 절대값도 함께 바뀐다 — 둘을 같이 본다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"
      # DB 접속 정보 — backend는 시작 시 Flyway가 DB에 연결하므로 필수.
      #   ⚠️ 컨테이너 안에서 DB_HOST는 반드시 내부망 DNS 'mysql' (localhost/127.0.0.1은 자기 자신 = 접속 불가).
      #   계정/DB명은 mysql 서비스 초기화 변수(MYSQL_*)와 동일 소스(.env)를 참조해 불일치를 원천 차단.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}       # = mysql 서비스의 MYSQL_DATABASE (b209)
      DB_USERNAME: ${MYSQL_USER}       # = 앱 전용 최소권한 계정 (root 아님)
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be configured in .env or deployment secrets}
      # BE→AI 내부 계약 인증 토큰 (S15P11B209-183 · safety review C-183-1).
      #   RestClientAiQuestionClient가 X-Internal-Token 헤더로 전송 — ai 서비스와 반드시 같은 값.
      #   reason: :? fail-fast — 미설정 채로 떠서 BE 호출이 전부 401→폴백으로 조용히 저하되는 것 방지.
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN must be configured in .env or deployment secrets}
      # ── 인증(JWT) — S15P11B209-320 (306~309 인증 머지 후속 배선).
      #   JWT_SECRET은 application.yml에 기본값이 없어, 미주입 시 인증 API 전체가
      #   503(AUTH_503_001)으로 조용히 죽는 것을 라이브에서 실측(D-190-1).
      #   reason: :? fail-fast — 인증은 서비스 필수. 조용한 503보다 배포가 명시적으로
      #           실패하는 게 낫다(REDIS_PASSWORD·AI_INTERNAL_TOKEN과 동일 정책).
      #   생성 예: openssl rand -hex 32  (32바이트 이상 필수)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured in .env or deployment secrets}
      # 선택 오버라이드 4종 — 앱에 안전한 기본값이 있어 비차단. compose 기본값은
      #   application.yml 기본값을 그대로 미러링한다.
      #   reason: ${VAR:-} (빈 문자열 전달)로 두면 스프링이 "빈 값이 설정됨"으로 읽어
      #           앱 기본값이 무시되고 TTL(Duration) 파싱 실패로 부팅이 깨진다
      #           → 기본값을 명시해 빈 문자열 주입을 원천 차단.
      JWT_ISSUER: ${JWT_ISSUER:-dodam-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-30m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-14d}
      OAUTH_CONNECT_TIMEOUT: ${OAUTH_CONNECT_TIMEOUT:-3s}
      OAUTH_READ_TIMEOUT: ${OAUTH_READ_TIMEOUT:-5s}
      # ── 모바일 OAuth Provider Token 검증 설정 — S15P11B209-375.
      #   reason: :- (빈 기본값) 비차단 passthrough — 콘솔 키가 아직 미발급일 수 있어
      #           :? 로 걸면 전체 배포가 막힌다. 앱이 provider별 fail-closed(미설정
      #           provider만 503)로 안전하게 처리하므로 "배포는 뜨고, 미설정 provider만
      #           막히는" 쪽을 택했다. 트레이드오프: 키를 깜빡해도 배포가 성공하므로
      #           배포 후 소셜 로그인 검증(503→정상) 필수. 앱 기본값도 빈 값이라
      #           빈 문자열 주입 = 미설정과 동일(위 TTL과 달리 안전).
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      # ── BE→AI 질문 호출 대상 주소 — S15P11B209-320 (D-183-1).
      #   RestClientAiQuestionClient가 ${AI_BASE_URL}로 읽는다. 앱 기본값은
      #   http://localhost:8000 인데 컨테이너 안 localhost는 backend 자신 = 도달 불가
      #   → 내부망 DNS(ai 서비스명)를 compose 기본값으로 주입. .env로 오버라이드 가능.
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      # 그림 분석 클라이언트(app.ai.drawing-analysis) — 현재 기본 mock(HTTP 미호출).
      #   http 전환 시 compose 수정 없이 .env(AI_DRAWING_ANALYSIS_MODE=http)로 켤 수 있게
      #   passthrough. base-url 앱 기본값도 localhost(도달 불가)라 내부망 DNS로 교정.
      AI_DRAWING_ANALYSIS_MODE: ${AI_DRAWING_ANALYSIS_MODE:-mock}
      AI_DRAWING_ANALYSIS_BASE_URL: ${AI_DRAWING_ANALYSIS_BASE_URL:-http://ai:8000}
      # 관찰 리포트 클라이언트(app.ai.observation) — 위 그림 분석과 같은 passthrough.
      #   2026-07-27: AI에 POST /internal/v1/observations 를 신설해 실호출이 가능해졌다(그 전에는 404).
      #   기본값은 mock 유지 — AI 배포가 먼저 반영된 뒤 .env(AI_OBSERVATION_MODE=http)로 켠다.
      #   base-url 앱 기본값이 localhost(컨테이너 안에선 backend 자신 = 도달 불가)라 내부망 DNS로 교정.
      AI_OBSERVATION_MODE: ${AI_OBSERVATION_MODE:-mock}
      AI_OBSERVATION_BASE_URL: ${AI_OBSERVATION_BASE_URL:-http://ai:8000}
      # 질문 TTS 클라이언트(app.ai.tts) — 위 그림 분석·관찰과 같은 passthrough.
      #   이 줄이 없어 컨테이너에 AI_TTS_MODE가 전달되지 않았고, TTS만 mock(무음 mp3)으로 동작했다
      #   (2026-07-29 실기기 확인: 질문 음성이 무음 · MockAiTtsClient가 텍스트 길이 비례 무음 프레임 반환).
      #   GMS TTS(gpt-4o-mini-tts) 실호출은 확인됨 → 기본값 http. base-url 앱 기본값 localhost는
      #   컨테이너 안에선 backend 자신(도달 불가)이라 내부망 DNS(ai)로 교정한다.
      AI_TTS_MODE: ${AI_TTS_MODE:-http}
      AI_TTS_BASE_URL: ${AI_TTS_BASE_URL:-http://ai:8000}
      # AI가 LocalImageStorage 원본을 가져갈 일회성 내부 URL. 외부 도메인이나 nginx를 사용하지 않는다.
      AI_IMAGE_ACCESS_BASE_URL: ${AI_IMAGE_ACCESS_BASE_URL:-http://backend:8080}
      AI_IMAGE_ACCESS_TOKEN_TTL: ${AI_IMAGE_ACCESS_TOKEN_TTL:-60s}
      # ── 아동 그림 스냅샷 저장 경로 — S15P11B209-349 (2차 MVP Day1 · 긴급 F1).
      #   application.yml 기본값이 상대경로(./storage/images)라 WORKDIR(/app) 기준으로 잡히는데,
      #   backend에 볼륨 마운트가 없어 컨테이너 재생성(매 배포)마다 아동 그림이 유실되는 구조였다.
      #   reason: 절대경로(/app/storage/images)로 고정 + 아래 backend-storage 네임드 볼륨 마운트로
      #           컨테이너 재생성에도 그림을 보존한다(가드레일 9절 — 아동 데이터 수명주기·유실 방지).
      LOCAL_IMAGE_STORAGE_ROOT: /app/storage/images
      # ── 파일 스토리지 전환(MinIO/S3) — S15P11B209-370. 로컬 디스크 → S3 호환 오브젝트 스토리지.
      #   STORAGE_MODE=local(기본)이면 로컬 볼륨, s3면 minio 사용. be-rw 계정으로 버킷 dodam 접근.
      LOCAL_AUDIO_STORAGE_ROOT: /app/storage/audio
      STORAGE_MODE: ${STORAGE_MODE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-dodam}
      MINIO_BE_USER: ${MINIO_BE_USER}
      MINIO_BE_PASSWORD: ${MINIO_BE_PASSWORD}
      # ── 푸시 기기 Token 암호화 키 — S15P11B209-549(NOTI-01 등록 API).
      #   notification_device_tokens.token_ciphertext 를 AES-256-GCM으로 봉인할 대칭키다.
      #   FCM 발송에는 Token 원문이 필요해 해시로 저장할 수 없어(Refresh Token과 다른 점)
      #   복호화 가능한 형태로 보관하며, 키는 코드·이미지에 두지 않고 환경변수로만 받는다.
      #   값: Base64(32바이트 랜덤) — 생성 예: openssl rand -base64 32
      #   reason: :- 빈 기본값 — 미설정이어도 앱은 정상 부팅하고 기기 Token '등록'만
      #           503 DEVICE_TOKEN_STORAGE_UNAVAILABLE로 거부된다(목록·읽음·해제는 정상).
      #           평문 저장으로 후퇴하지 않으므로 :? fail-fast로 배포를 막을 필요는 없다.
      #   ⚠️ 키를 교체하면 이전 암호문은 복호화 불가(GCM 인증 실패) → 해당 기기는 재로그인으로
      #      Token을 다시 등록해야 발송 대상이 된다. 556 발송 붙기 전에 한 번 정해 두는 게 좋다.
      PUSH_DEVICE_TOKEN_ENCRYPTION_KEY: ${PUSH_DEVICE_TOKEN_ENCRYPTION_KEY:-}
      # ── FCM 푸시(분석 완료 알림) 자격증명 — S15P11B209-619(인프라 배관) ↔ BE S15P11B209-556(발송 코드).
      #   목적: 백엔드가 Firebase로 푸시를 보낼 때 쓰는 Service Account JSON(개인키 포함)을
      #         이미지/코드에 굽지 않고 런타임에 /run/secrets/ 로만 주입한다(유출면 최소화 · 가드레일 9절).
      #   기본 OFF: 616 JSON·556 코드가 아직 없어도 backend가 정상 부팅하도록 enabled=false.
      #   활성화(616 발급 + 556 머지 후): .env(배포는 Jenkins 크리덴셜 dodam-env)에 두 줄만 추가 —
      #     APP_PUSH_FCM_ENABLED=true
      #     FCM_CREDENTIALS_HOST_PATH=/etc/dodam/secrets/fcm-service-account.json   # 아래 top-level secrets가 참조
      #     ⚠️ 반드시 호스트 절대경로 — 상대경로 금지(사유는 파일 하단 secrets: 주석 · S15P11B209-641)
      #   reason: :- 기본값(false)으로 미설정·미발급에도 배포가 안 깨진다. 푸시는 선택 기능이라
      #           REDIS_PASSWORD·JWT_SECRET 같은 :? fail-fast 대상이 아니다(있으면 켜고 없으면 조용히 끔).
      APP_PUSH_FCM_ENABLED: ${APP_PUSH_FCM_ENABLED:-false}
      # 컨테이너 내부에서 자격증명을 읽을 고정 경로(= 아래 backend.secrets의 target).
      #   BE(556)가 app.push.fcm.credentials-path 로 바인딩해 FirebaseApp 초기화에 사용.
      APP_PUSH_FCM_CREDENTIALS_PATH: /run/secrets/fcm-service-account.json

    # 아동 그림 스냅샷 영속화 — 네임드 볼륨(backend-storage)을 /app/storage 에 마운트 (S15P11B209-349 · 가드레일 9절).
    #   컨테이너를 지우고 다시 만들어도 /app/storage 이하 그림 파일은 유지된다.
    #   ⚠️ 마운트 지점은 WORKDIR(/app, backend/Dockerfile) 기준 절대경로 — 위 LOCAL_IMAGE_STORAGE_ROOT(/app/storage/images)와 일치.
    volumes:
      - backend-storage:/app/storage

    # FCM Service Account 자격증명 주입 — 이 컨테이너에만 read-only로 /run/secrets/fcm-service-account.json (S15P11B209-619).
    #   아래 top-level secrets.fcm_service_account 를 참조. 기본 소스가 /dev/null(빈 파일)이라
    #   미발급(616 전) 상태에서도 기동에 안전 — 위 APP_PUSH_FCM_ENABLED=false 와 짝을 이룬다.
    secrets:
      - source: fcm_service_account
        target: fcm-service-account.json

    # ⚠️ ports 를 열지 않는다 — 호스트엔 노출 안 함. 내부망(dodam-net)에서 'backend:8080'으로만 접근.
    expose:
      - "8080"                   # 문서화 목적(같은 네트워크의 nginx가 이 포트로 프록시)

    # DB가 healthy 된 뒤 기동. (지금 backend는 DB 미사용이나, JPA 도입 대비 순서 보장)
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # ⚠️ minio-init 에는 의존하지 않는다 — 2026-07-26 장애의 직접 연결고리였다.
      #   service_completed_successfully 로 묶여 있어 1회성 프로비저닝이 실패하자
      #   backend 가 기동조차 못 했고, backend 를 기다리던 nginx 까지 멈춰 전면 중단됐다.
      #   프로비저닝(버킷·계정)은 배포와 분리된 선행 조건으로 다룬다(minio-init 은 profiles: init).

    # actuator가 없어 HTTP 헬스체크 불가 → 8080 리슨 여부만 TCP로 확인 (jre-jammy에 bash 존재)
    #   더 정확한 헬스체크를 원하면 actuator 추가 후 /actuator/health 로 교체 (리뷰 포인트)
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s          # 스프링 부팅 여유

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # ai — 도담 AI 분석 서버(FastAPI, Python). 내부망 전용. 대화 LLM·STT·TTS를 GMS로 호출.
  #      ⚠️ 아동 음성/발화가 지나가는 서비스 → 호스트 포트 미개방, 외부 진입은 nginx /ai 로만.
  # ───────────────────────────────────────────────────────────────
  ai:
    build:
      context: ../ai             # 빌드 컨텍스트 = 리포지토리 ai/ (compose 파일 위치 기준 상대경로)
      dockerfile: Dockerfile     # ai/Dockerfile
    image: dodam-ai:local        # 로컬 빌드 이미지 이름. CI 도입 시 레지스트리 태그로 대체
    container_name: dodam-ai
    restart: unless-stopped
    mem_limit: 2g                  # S15P11B209-356 — 07-28 호스트 OOM 대응
                                   #   reason: 유휴 약 83MB 이지만 그림 분석(ONNX 추론)은 이미지 크기에 따라
                                   #   수백 MB~1GB 를 순간적으로 쓴다. 유휴값이 아니라 추론 피크에 맞춰 잡는다.
                                   #   상한에 닿아 죽는다면 줄이지 말고 배치 크기·입력 해상도부터 볼 것.

    # GMS 접속·모델 설정을 .env에서 주입(이 파일엔 값 없음). ai가 필요로 하는 키만 선별 주입(최소권한).
    #   ⚠️ GMS_KEY 는 비밀 — 절대 하드코딩·로그 금지. 값은 .env 에만 존재.
    environment:
      GMS_KEY: ${GMS_KEY}                        # GMS(OpenAI 호환) 인증 키 — 필수, 기본값 없음
      GMS_BASE_URL: ${GMS_BASE_URL}              # GMS 프록시 엔드포인트
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}       # 대화 LLM
      STT_MODEL: ${STT_MODEL:-whisper-1}         # 음성→텍스트
      TTS_MODEL: ${TTS_MODEL:-gpt-4o-mini-tts}   # 텍스트→음성(지시형)
      TTS_VOICE: ${TTS_VOICE:-fable}             # 곰돌이 톤 보이스
      # BE↔AI 내부 계약 인증 토큰 (S15P11B209-183 · safety review C-183-1).
      #   backend 서비스와 반드시 같은 값 — ai가 X-Internal-Token 헤더를 이 값과 대조.
      #   reason: :? fail-fast(redis와 동일) — 미설정이면 내부 계약이 무인증으로 뜨는 게 최악이라
      #           compose 기동 자체를 막는다. ai 앱도 미설정 시 기동 실패(ai/main.py — 이중 안전장치).
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN must be configured in .env or deployment secrets}
      # YOLO 가중치 경로 — 이미지에 굽지 않고 볼륨으로 주입한다.
      #   reason: .gitignore가 *.pt를 막아 Jenkins 체크아웃엔 파일이 없다.
      #           이미지에 구우면 로컬 빌드만 성공하고 CI 빌드는 가중치 없는 이미지를 만든다.
      #   ⚠️ 모델 2종을 모두 주입해야 한다(S15P11B209-721). config.py 기본값은 컨테이너
      #      상대경로(/app/models/...)라 볼륨 /models 와 어긋나고, health 의 objectDetection 은
      #      "HTP·그림일기 가중치 둘 다 존재 + checksum" 으로 판정하므로 하나만 빠져도 NOT_READY 다.
      YOLO_MODEL_PATH: /models/htp_yolo/htp_best.pt        # HTP(집·나무·사람)
      SKETCH_MODEL_PATH: /models/htp_yolo/sketch_base.pt   # 그림일기(자유 그림)
      
    # 학습 산출물(가중치) — apk-dist와 같은 방식(docker cp 업로드, git 비추적).
    #   :ro — 추론만 하므로 컨테이너에 쓰기 권한을 주지 않는다(최소권한).
    volumes:
      - ai-models:/models:ro

    # ⚠️ ports 를 열지 않는다 — 호스트엔 노출 안 함. 내부망(dodam-net)에서 'ai:8000'으로만 접근.
    expose:
      - "8000"                   # 문서화 목적(같은 네트워크의 nginx가 이 포트로 프록시)

    # /health 로 기동 완료 판단. slim 이미지엔 curl이 없어 python stdlib(urllib)로 확인.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s          # 앱 import(openai·pydantic 로딩)에 1~2초 걸림 → 여유
    # NOTE: ai 는 mysql을 쓰지 않으므로 depends_on 없음(GMS만 호출). backend와 독립 기동.

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # web — 커뮤니티 웹(Next.js standalone). S15P11B209-383
  #
  # ⚠️ 실행은 k3s 가 한다(infra/k8s/base/web.yaml). 이 블록이 있는 이유는 **빌드** 때문이다 —
  #    Jenkins 의 Docker Build 스테이지가 `docker compose build` 로 이미지를 만들고,
  #    그 결과를 레지스트리에 밀어 k3s 가 당겨간다. 여기 없으면 dodam-web 이 안 만들어진다.
  # ───────────────────────────────────────────────────────────────
  web:
    build:
      context: ../frontend/web   # 빌드 컨텍스트 = 리포지토리 frontend/web
      dockerfile: Dockerfile
      args:
        # ★ NEXT_PUBLIC_* 는 빌드 시점에 번들에 구워진다 — 런타임 env 로는 못 바꾼다.
        #   상대경로라 웹과 API 가 같은 오리진(gateway)이면 도메인이 바뀌어도 재빌드가 필요 없다.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    image: dodam-web:local       # 로컬 빌드 이미지 이름(backend·ai·nginx 와 동일 규칙)
    container_name: dodam-web
    restart: unless-stopped
    mem_limit: 512m              # k8s 매니페스트의 limits 와 맞춘다

    # 호스트 3000 은 Grafana 가 점유 중이다. 포트를 열지 않고 gateway 를 통해서만 노출한다.
    expose:
      - "3000"

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # nginx — 리버스 프록시. ★ 유일하게 외부(호스트)로 열리는 서비스. (EC2 UFW도 80/443만 허용)
  # ───────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx           # 빌드 컨텍스트 = infra/nginx (conf.d 포함 — Dockerfile이 이미지에 COPY)
      dockerfile: Dockerfile
    image: dodam-nginx:local     # 로컬 빌드 이미지 — conf 내장. 베이스는 nginx:1.27-alpine(버전 고정)
    container_name: dodam-nginx
    restart: unless-stopped
    mem_limit: 512m                # S15P11B209-356 — 07-28 호스트 OOM 대응
                                   #   reason: 실사용 약 13MB. 리버스 프록시는 버퍼링 때문에 동시 업로드가
                                   #   많으면 늘지만 512MB 를 넘길 구성이 아니다. 넉넉히 40배.

    ports:
      - "80:80"                  # ACME 챌린지 + https 리다이렉트 전용
      - "443:443"                # 실서비스 진입점(TLS 종단) — S15P11B209-301

    # ⚠️ conf 를 bind 마운트하지 않는다 — 실행 위치(호스트/Jenkins)에 따라 경로가 달라져
    #    빈 conf 가 마운트되는 사고(2026-07-22)가 있었음. conf 는 이미지에 bake(위 build 참조).
    #    conf 변경 → 커밋 → 파이프라인이 이미지 재빌드 + 컨테이너 재생성으로 반영.
    # 인증서·ACME 챌린지는 "네임드 볼륨"이라 실행 위치와 무관(bind 아님) + 저장소에 인증서 커밋 금지(가드레일).
    volumes:
      - letsencrypt:/etc/letsencrypt:ro         # 인증서 읽기(발급·갱신은 certbot이 씀)
      - certbot-webroot:/var/www/certbot:ro     # ACME 챌린지 토큰 서빙용
      - apk-dist:/var/www/apk                   # 팀·데모용 APK 서빙(docker cp로 업로드, git 비추적)

    depends_on:
      backend:
        condition: service_healthy   # backend가 뜬 뒤 프록시 시작
      ai:
        condition: service_started   # ai 컨테이너 '시작'만 보장(=nginx가 'ai' 호스트를 해석 가능). health엔 안 묶음 → ai 장애가 게이트웨이(/api)까지 막지 않게. (초기 /ai 는 일시 502 가능)

    networks:
      - dodam-net

  # ───────────────────────────────────────────────────────────────
  # certbot 서비스는 제거됐다 (S15P11B209-746, 2026-07-30).
  #
  # TLS 갱신은 이제 **k8s CronJob `certbot-renew`** 소관이다
  #   (infra/k8s/base/cronjobs.yaml · 하루 2회 17 3,15 * * * UTC).
  #
  # 왜 지웠나: 360 컷오버로 compose nginx 가 멈춘 뒤부터 이 컨테이너는 **갱신할 수 없었다.**
  #   webroot 챌린지 토큰을 써도 그걸 서빙하던 nginx 가 없어 LE 가 읽어갈 수 없다.
  #   그런데 만료 30일 전이 아니라 매번 no-op 으로 끝나 로그가 깨끗했다 —
  #   "이중화가 있으니 괜찮다"는 착시만 남기고 실제로는 아무 일도 하지 않았다.
  #   k3s 경로는 LE 스테이징 dry-run 으로 실증했다("all simulated renewals succeeded").
  #
  # ⚠️ 아래 볼륨 선언(letsencrypt · certbot-webroot)은 **지우지 말 것** —
  #   nginx 서비스가 아직 참조한다. 지우면 compose 파일 보간이 깨져
  #   Jenkins 의 `docker compose build` 가 통째로 실패한다.
  # ───────────────────────────────────────────────────────────────

# 내부 전용 네트워크 — mysql·backend·ai·nginx가 여기 붙는다. 외부 노출은 nginx만.
networks:
  dodam-net:
    driver: bridge

# 네임드 볼륨 — mysql 데이터 · TLS 인증서 · ACME 챌린지
volumes:
  redis-data:
  mysql-data:
  letsencrypt:        # /etc/letsencrypt (인증서·계정) — 컨테이너 재생성에도 유지, 저장소 비추적
  certbot-webroot:    # ACME HTTP-01 챌린지 토큰 교환용 (certbot 씀 ↔ nginx 서빙)
  apk-dist:           # 팀·데모용 APK 파일 (docker cp로 업로드 — 바이너리는 git에 넣지 않음)
  backend-storage:    # /app/storage (아동 그림 스냅샷) — 컨테이너 재생성에도 유지 (S15P11B209-349 · 가드레일 9절)
  ai-models:          # YOLO 가중치 (*.pt) — 바이너리는 git에 넣지 않는다
  minio-data:         # MinIO 오브젝트 데이터 (아동 그림·음성 파일) — 컨테이너 재생성에도 유지 (가드레일 9절)

# ───────────────────────────────────────────────────────────────
# secrets — 런타임 비밀 파일 주입(도커 시크릿). 이미지·compose에 값이 남지 않고 컨테이너 tmpfs로만 전달.
#   fcm_service_account: Firebase 푸시 발송용 Service Account JSON(개인키). S15P11B209-619.
#     · 기본 소스 = /dev/null → 616 발급 전에는 빈 파일이 마운트돼 compose·부팅이 안 깨진다.
#     · 발급 후: 배포 서버 /etc/dodam/secrets/fcm-service-account.json (권한 600) 에 두고
#               Jenkins 크리덴셜 dodam-env 에
#               FCM_CREDENTIALS_HOST_PATH=/etc/dodam/secrets/fcm-service-account.json 지정.
#     ⚠️ file: 은 반드시 "워크스페이스 밖 호스트 절대경로". 상대경로(./secrets/...)를 쓰면 안 된다 —
#        배포는 Jenkins 컨테이너 안에서 호스트 도커 데몬을 호출하므로(DooD) 상대경로가
#        호스트에 없는 워크스페이스 경로로 해석돼 빈 디렉터리가 붙는다. 같은 함정으로
#        2026-07-22 nginx 빈 conf · 2026-07-26 minio-init 전면 장애(S15P11B209-641)가 났다.
#        파이프라인의 Compose/Secrets Preflight 가 상대경로를 발견하면 빌드를 실패시킨다.
#     ⚠️ 이 JSON은 절대 커밋 금지 — infra/secrets/ 는 .gitignore(secrets/)로 무시된다. 상세: infra/secrets/README.md
# ───────────────────────────────────────────────────────────────
secrets:
  fcm_service_account:
    file: ${FCM_CREDENTIALS_HOST_PATH:-/dev/null}
