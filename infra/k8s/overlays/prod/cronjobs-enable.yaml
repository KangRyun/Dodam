# 운영에서 백업 CronJob 3종을 켠다 (S15P11B209-733)
#
# base 는 세 잡 모두 suspend: true 다. 켜는 판단은 환경마다 달라야 해서 overlay 의 몫이다
# (staging 에서 켜지면 같은 hostPath /var/backups/dodam 에 운영 백업과 섞여 쌓인다).
#
# ⚠️⚠️ 이 패치를 kustomization.yaml 의 patches 에 넣어 apply 하는 것은
#      **호스트 cron 을 제거하는 것과 같은 시점이어야 한다.**
#
#      호스트 cron 과 이 CronJob 은 같은 시각(04:00 / 04:30)에 돌고,
#      STAMP 형식(date +%F-%H%M)도 같아서 **같은 파일명을 두고 경쟁한다.**
#      두 벌이 동시에 살아 있으면 DB 부하가 두 배인 것으로 끝나지 않고,
#      한쪽의 .part → mv 가 다른 쪽 산출물을 덮어쓴다.
#
#      제거 대상 (둘 다):
#        · root crontab   `0 4 * * *  …/mysql-backup.sh`
#        · /etc/cron.d/dodam-minio-backup   `30 4 * * *  …/minio-backup.sh`
#
# ⚠️ 켜기 전 선행 조건은 base/cronjobs.yaml 의 MySQL 백업 주석에 적어 뒀다.
#    요지: Secret dodam-backup 존재(완료) + **복원 드릴 1회 성공**.
#    "백업이 돌았다"는 검증이 아니다. 복원되는 것만이 검증이다.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: dodam
spec:
  suspend: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  namespace: dodam
spec:
  suspend: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
  namespace: dodam
spec:
  suspend: false
---
# 매니페스트 드리프트 감시 (S15P11B209-751)
#
# base 가 suspend: true 인 이유는 백업과 같다 — 선행 조건(Secret `dodam-drift-git`)이
# 갖춰지지 않은 환경에서 켜지면 initContainer 가 CreateContainerConfigError 로 계속 재시도한다.
#
# ★ 이 항목이 없으면 **게이트가 자기 자신을 드리프트로 신고한다.**
#   운영에서 손으로 `patch ... suspend:false` 하면 git(true)과 클러스터(false)가 갈라지고,
#   그 차이는 사라지지 않으므로 매시간 경보가 뜬다. 2026-07-30 배포 직후 실제로 그렇게 났다.
#   "운영에서 켠다"는 판단은 overlay 로 선언해야 드리프트가 아니게 된다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: manifest-drift-check
  namespace: dodam
spec:
  suspend: false
