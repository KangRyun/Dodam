# 운영 overlay — S15P11B209-360 컷오버 시점에만 적용 (S15P11B209-357)
#
# ⚠️⚠️ 이 overlay 를 apply 하면 **운영 80/443 을 k8s 가 가져간다.**
#    compose nginx 가 아직 그 포트를 잡고 있으면 gateway 파드가 뜨지 못하고,
#    억지로 성공하면 서비스 진입점이 바뀐다. 순서를 반드시 지킨다:
#
#      1. 데이터 이관 (mysql dump→restore · minio mirror · letsencrypt 복사)
#      2. compose nginx 중지            docker compose -f infra/docker-compose.yml stop nginx
#      3. 이 overlay apply
#      4. e2e 확인 (landing 200 · ai 200 · api-401 401)
#      5. 실패 시 → 3 되돌리고 compose nginx 재기동
#
#    자세한 절차와 롤백은 360 이슈와 docs/인프라/배포검증-롤백.md 에서 확정한다.
#    **이 파일이 있다는 것이 컷오버 승인을 뜻하지 않는다.**
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dodam

resources:
  - ../../base

images:
  # 태그는 Jenkins 가 커밋 SHA 로 덮어쓴다(359). latest 를 쓰지 않는 이유는
  # "무엇이 배포됐는지"를 나중에 되짚을 수 있어야 하기 때문이다.
  - name: dodam-backend
    newName: 127.0.0.1:5000/dodam-backend
    newTag: prod
  - name: dodam-ai
    newName: 127.0.0.1:5000/dodam-ai
    newTag: prod
  - name: dodam-nginx
    newName: 127.0.0.1:5000/dodam-nginx
    newTag: prod

patches:
  - path: gateway-hostport.yaml
  # prod 전용 AI 연동 모드(그림분석·관찰·TTS)를 실 AI(http)로 올린다. base 는 mock 유지.
  - path: configmap-ai-modes.yaml
