# 운영 overlay — S15P11B209-360 컷오버 시점에만 적용 (S15P11B209-357)
#
# ⚠️⚠️ 이 overlay 를 apply 하면 **운영 80/443 을 k8s 가 가져간다.**
#    compose nginx 가 아직 그 포트를 잡고 있으면 gateway 파드가 뜨지 못하고,
#    억지로 성공하면 서비스 진입점이 바뀐다. 순서를 반드시 지킨다:
#
#      1. 데이터 이관 (mysql dump→restore · minio mirror · letsencrypt 복사)
#      2. compose nginx 중지            docker compose -f infra/docker-compose.yml stop nginx
#      3. 이 overlay apply
#      4. e2e 확인 (landing 200 · ai 200 · api-401 401)
#      5. 실패 시 → 3 되돌리고 compose nginx 재기동
#
#    자세한 절차와 롤백은 360 이슈와 docs/인프라/배포검증-롤백.md 에서 확정한다.
#    **이 파일이 있다는 것이 컷오버 승인을 뜻하지 않는다.**
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dodam

resources:
  - ../../base
  # 저장소를 외부에 여는 리소스는 여기 없다 — 그것이 기본값이다(S15P11B209-970).
  #   2026-07-31~08-06 사이에는 `mysql-nodeport.yaml`(NodePort 30306) 이 여기 있었다.
  #   운영 MySQL 을 인터넷에 직접 노출하던 것이고, 970 에서 회수했다.
  #   사람이 GUI 로 붙는 경로는 SSH 터널로 대체했다 — `infra/k3s/dodam-mysql-tunnel.service`
  #   와 `docs/인프라/DB접속.md` §1-a. 다시 열자는 요구가 오면 그 문서의
  #   "왜 화이트리스트가 불가능한가"부터 읽을 것.

images:
  # 태그는 Jenkins 가 커밋 SHA 로 덮어쓴다(359). latest 를 쓰지 않는 이유는
  # "무엇이 배포됐는지"를 나중에 되짚을 수 있어야 하기 때문이다.
  - name: dodam-backend
    newName: 127.0.0.1:5000/dodam-backend
    newTag: prod
  - name: dodam-ai
    newName: 127.0.0.1:5000/dodam-ai
    newTag: prod
  - name: dodam-nginx
    newName: 127.0.0.1:5000/dodam-nginx
    newTag: prod
  - name: dodam-web
    newName: 127.0.0.1:5000/dodam-web
    newTag: prod

patches:
  - path: gateway-hostport.yaml
  # prod 전용 AI 연동 모드(그림분석·관찰·TTS)를 실 AI(http)로 올린다. base 는 mock 유지.
  - path: configmap-ai-modes.yaml
  # 운영에서 켜는 CronJob 들 — base 는 전부 suspend: true 이고 여기서 false 로 뒤집는다.
  #   백업 3종(733): 호스트 cron 제거·복원 드릴 성공을 확인한 뒤 2026-07-30 에 활성화했다.
  #     (그 전까지는 이 줄이 주석 처리돼 있었다 — 두 벌이 같은 시각·같은 파일명으로 돌기 때문)
  #   드리프트 점검(751): 2026-07-30 추가. 운영 상태를 여기 선언하지 않으면
  #     손으로 suspend 를 푼 순간 git 과 갈라져 **게이트가 자기 자신을 신고한다.**
  - path: cronjobs-enable.yaml
