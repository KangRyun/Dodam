# MySQL 외부 개방 — NodePort (2026-07-31, 사용자 지시)
#
# ⚠️⚠️⚠️ 이 파일은 **운영 MySQL(b209)을 인터넷에 직접 노출한다.**
#    그 안에 든 것은 아동의 그림·대화·감정 기록이다. 노출면을 0 으로 두던
#    기존 설계(docs/인프라/DB접속.md §1·§4)를 **의도적으로 뒤집는 변경**이며,
#    되돌리는 방법은 이 파일 하단에 적어 둔다.
#
# ★ 왜 기존 `mysql` Service 를 고치지 않고 새 Service 를 만드는가
#   `mysql` 은 headless(clusterIP: None) 다. StatefulSet 파드에 안정적인 DNS 이름
#   (mysql-0.mysql...)을 주는 것이 그 역할이고, backend 의 DB_HOST=mysql 이 여기 걸려 있다.
#   headless 는 NodePort 로 바꿀 수 없다(clusterIP 를 None 에서 바꾸는 것은 불변 필드 위반).
#   억지로 바꾸면 Service 재생성 → 그 사이 backend 의 DNS 해석이 깨진다.
#   → 파드는 그대로 두고 **입구만 하나 더** 내는 방식이 무중단이고 되돌리기도 쉽다.
#
# ★ 왜 base 가 아니라 prod overlay 인가
#   base 에 넣으면 staging·staging-min 까지 같이 열린다. 노출은 운영 한 곳만으로 좁힌다.
#   (그리고 이 파일이 overlay 에 있으므로 base 의 commonLabels 는 주입되지 않는다.
#    selector 에 라벨이 섞여 들어가는 jenkins-external.yaml 류의 사고가 여기서는 없다.)
#
# ★ 이 매니페스트만으로는 아직 외부에서 닿지 않을 수 있다 — 관문이 셋이다
#     ① k8s      : 이 Service (여기서 해결)
#     ② UFW      : sudo ufw allow 30306/tcp        ← 사람이 직접 (sudo 비밀번호 필요)
#     ③ 보안그룹 : SSAFY 가 관리한다. 30306 이 막혀 있으면 ①②를 해도 timeout 이다.
#   ③은 우리 권한 밖이라 "열리지 않으면 여기가 원인"이라는 사실만 남겨 둔다.
#
# ★ 되돌리기 (노출을 닫을 때)
#     kubectl -n dodam delete svc mysql-ext
#     sudo ufw delete allow 30306/tcp
#     그리고 이 파일과 kustomization.yaml 의 참조 줄을 함께 지운다.
#     ⚠️ 클러스터에서만 지우고 git 을 그대로 두면 드리프트 게이트(751)가 경보를 울린다.
#        "git 에 있는데 클러스터에 없다" 가 정확히 그 잡이 잡는 상태다.
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-ext
  namespace: dodam
  labels:
    app: mysql
    app.kubernetes.io/part-of: dodam
  annotations:
    # 왜 존재하는지를 클러스터 안에도 남긴다. 나중에 이 Service 를 발견한 사람이
    # "왜 DB 가 밖에 열려 있지?" 를 kubectl describe 만으로 알 수 있어야 한다.
    dodam.io/exposure: "public"
    dodam.io/reason: "외부 DB 접속 요청 (2026-07-31) — 상시 개방. 닫을 때는 파일 하단 절차대로"
spec:
  type: NodePort
  # selector 는 base 의 mysql StatefulSet 파드를 그대로 가리킨다.
  #   파드 라벨이 {app: mysql, app.kubernetes.io/part-of: dodam} 이므로 app 하나로 충분하다.
  selector: { app: mysql }
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      # 30306 = 3306 을 NodePort 대역(30000~32767)으로 옮긴 값. 고정해 둬야
      # 방화벽 규칙·문서·접속 정보가 재적용 때마다 흔들리지 않는다.
      nodePort: 30306
