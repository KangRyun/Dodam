# 앱 스택 전용 네임스페이스 (S15P11B209-357)
#
# 왜 나누나: compose 의 `name: dodam` 이 하던 역할 — 이름 충돌 방지와 일괄 삭제 단위.
#   네임스페이스 하나를 지우면 그 안의 워크로드가 전부 사라진다(PVC 포함 — 주의).
#
# ⚠️ 서비스 이름을 compose 서비스명과 똑같이 유지하는 게 이 설계의 핵심이다.
#   같은 네임스페이스 안에서는 `mysql`·`redis`·`minio`·`ai`·`backend` 가 그대로 해석되므로,
#   backend 의 DB_HOST=mysql, AI_BASE_URL=http://ai:8000 같은 **접속 값을 하나도 안 바꿔도 된다.**
apiVersion: v1
kind: Namespace
metadata:
  name: dodam
  labels:
    app.kubernetes.io/part-of: dodam
