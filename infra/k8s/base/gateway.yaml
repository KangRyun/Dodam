# Gateway(nginx) — Deployment + conf ConfigMap (S15P11B209-357)
#
# compose 의 nginx 서비스를 옮긴 것. 이미지는 그대로 쓴다(dodam-nginx) — 정적 페이지
# (랜딩·/download·/legal)가 이미지에 bake 돼 있기 때문이다. **conf 만 ConfigMap 으로 뺀다.**
#   → conf 를 고칠 때 이미지 재빌드 없이 ConfigMap 만 바꾸고 롤아웃하면 된다.
#
# ⚠️ 80/443 을 언제 잡는지는 이 base 가 정하지 않는다.
#     overlays/staging → NodePort (30080/30443, 운영 포트 미점유)
#     overlays/prod    → hostPort 80/443 (컷오버 360 시점에만)
#   356 의 "라이브 무접촉" 원칙을 매니페스트 구조로 강제한 것이다.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-conf
  namespace: dodam
data:
  default.conf: |
    # ⚠️ 이 파일은 infra/nginx/conf.d/default.conf 를 k8s 용으로 옮긴 것이다.
    #    원본을 고치면 여기도 같이 고쳐야 한다 — 두 벌이 갈라지면 컷오버에서 사고가 난다.
    #    (360 이후에는 이쪽이 단일 원본이 되고 compose 쪽은 폐기한다)
    #
    # compose 판과 다른 점은 딱 두 가지다:
    #   ① resolver 127.0.0.11(도커 내장 DNS) → kube-dns ClusterIP
    #   ② dodam-jenkins / dodam-grafana 는 클러스터 밖에 있어 수동 Endpoints 로 연결
    server_tokens off;

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name i15b209.p.ssafy.io;

        ssl_certificate     /etc/letsencrypt/live/i15b209.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/i15b209.p.ssafy.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ★ 앱 상한보다 높아야 한다(S15P11B209-670). 낮거나 같으면 nginx 가 먼저 잘라
        #   클라이언트가 앱의 413 JSON 대신 nginx 기본 HTML 413 을 받는다(파싱 실패 → 원인 불명).
        #   기준선: spring.servlet.multipart.max-request-size = 22020096B(21 MiB).
        client_max_body_size 22m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # 웹 소셜 로그인의 code→token 교환 (S15P11B209-817). Next Route Handler
        # (frontend/web/src/app/api/oauth/[provider]/route.ts) 가 처리한다 — client secret 이
        # 필요해 브라우저가 직접 못 하고, 그래서 웹 서버 쪽에 있어야 한다.
        #
        # ⚠️ 이 블록이 없으면 아래 `location /api/` 가 먼저 잡아 **Spring 으로 가고 404** 가 된다.
        #   코드·시크릿·매니페스트가 전부 정상이어도 브라우저에서 버튼을 눌러야만 드러나는
        #   종류의 결함이다(2026-08-04 실측: /api/oauth/kakao → COMMON_404_001).
        #   nginx 는 접두 location 중 **가장 긴 것**을 고르므로 순서와 무관하게 이 블록이 이긴다.
        #
        # 백엔드와 겹치지 않는다: 앱(Flutter)이 쓰는 백엔드 경로는 `/api/v1/auth/oauth/{provider}`
        # 이고(OAuthController @RequestMapping("/api/v1/auth")), 여기는 버전 없는 `/api/oauth/` 다.
        location /api/oauth/ {
            proxy_pass http://web:3000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # BE 내부 API — 외부에는 경로 존재 자체를 숨긴다(403은 "있다"는 힌트가 된다).
        # ⚠️ location 에 add_header 가 생기면 server 블록 상속이 끊긴다 → 4종을 복사한다.
        location /internal/ {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 404;
        }

        # /ai/ 는 접두를 떼고 전달하므로, 아래 두 블록이 없으면 외부에서
        # ai 컨테이너의 /internal/* 과 /metrics 에 그대로 도달한다.
        # nginx 최장 접두 매칭 — 둘 다 /ai/ 보다 길어 먼저 매칭된다.
        location /ai/internal/ {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 404;
        }

        location /ai/metrics {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 404;
        }

        # ── FastAPI 자동 문서 3종 외부 차단 (2026-08-07 safety review W1) ──────
        #   ai/main.py:89 의 `FastAPI(title=..., version=...)` 는 docs_url·openapi_url·
        #   redoc_url 을 **기본값 그대로** 둔다(/docs · /openapi.json · /redoc).
        #   위 /ai/ 프록시가 접두를 떼고 전달하므로, 이 블록이 없으면 외부에서
        #   **내부 계약 스키마 전체**가 읽힌다 — 엔드포인트 목록·요청/응답 필드명·모델
        #   스키마가 그대로 노출되고, 그중에는 아동 발화·그림 분석 계약(/internal/ai/v1/*)의
        #   형태도 포함된다. /ai/internal/ · /ai/metrics 와 같은 처리다:
        #   403 이 아니라 404 로 **존재 자체를 숨긴다**.
        #
        #   `=`(정확 일치)인 이유: FastAPI 기본 경로가 정확히 이 셋이고, 접두로 넓게 잡으면
        #   향후 /ai/d… 로 시작하는 정상 분석 라우트까지 삼킬 수 있다.
        #   ⚠️ 남는 틈: `/ai/docs/oauth2-redirect` 는 정확 일치가 아니라 통과한다.
        #     스키마가 없는 정적 리다이렉트 페이지라 유출 가치는 없다. 완전 차단이 필요하면
        #     `= /ai/docs` 를 접두 `location /ai/docs` 로 바꾼다.
        #
        # ⚠️ 이 3개 블록은 `infra/nginx/conf.d.compose/default.conf`(컷백 compose 가 마운트)에도
        #    **똑같이** 들어가 있다. 한쪽만 고치면 컷백/롤백 때 차단이 사라진다 —
        #    /api/oauth/ 가 정확히 그렇게 갈라졌던 자리다(D4).
        location = /ai/docs {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 404;
        }

        location = /ai/openapi.json {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 404;
        }

        location = /ai/redoc {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 404;
        }

        location /ai/ {
            proxy_pass http://ai:8000/;   # ★ 끝의 '/' = 접두(/ai/)를 떼고 전달
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /download/dodam.apk {
            alias /var/www/apk/dodam.apk;
        }

        # /jenkins/ · /grafana/ 는 **클러스터 밖**(호스트 compose)에 있다.
        #   ① resolver 를 kube-dns 로 바꿨다. 도커 내장 DNS(127.0.0.11)는 파드 안에 없다.
        #   ② 변수+resolver 패턴은 그대로 유지 — 대상이 꺼져 있어도 nginx 는 뜨고 해당 경로만 502.
        #      고정 proxy_pass 로 바꾸면 Jenkins 가 없을 때 게이트웨이 전체가 못 뜬다.
        #   ③ dodam-jenkins 는 base/jenkins-external.yaml 의 수동 Endpoints 가 호스트로 연결한다.
        #      dodam-grafana 는 S15P11B209-361 에서 붙인다 — 그 전까지 /grafana/ 는 502 가 정상이다.
        # ⚠️ resolver 는 **IP 리터럴만** 받는다. 호스트명도, 환경변수도 못 쓴다
        #    (dodam-nginx 이미지는 envsubst 템플릿을 쓰지 않고 conf 를 그대로 읽는다).
        #    아래 10.43.0.10 은 k3s 기본 Service CIDR(10.43.0.0/16)의 kube-dns 주소다.
        #    설치 후 반드시 실측으로 확인할 것:
        #      kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'
        #    다르면 이 값을 고치고 `kubectl -n dodam rollout restart deployment/gateway`.
        location /jenkins/ {
            resolver 10.43.0.10 valid=30s;
            set $jenkins_upstream http://dodam-jenkins.dodam.svc.cluster.local:8080;
            proxy_pass $jenkins_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $http_connection;
        }

        location /grafana/ {
            resolver 10.43.0.10 valid=30s;   # 위 주석 참조 — 설치 후 실측 확인
            set $grafana_upstream http://dodam-grafana.dodam.svc.cluster.local:3000;
            proxy_pass $grafana_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $http_connection;
        }

        # ★ /legal/ · /download/ 는 이미지에 bake 된 정적 페이지다(dodam-nginx 의 html/).
        #   383 전에는 catch-all `location /` 이 정적 root 를 서빙해서 이 둘이 딸려 왔다.
        #   `location /` 을 웹 프록시로 바꾸는 순간 **딸려오던 것이 사라진다** —
        #   전용 location 이 없으면 개인정보처리방침·이용약관이 통째로 404 가 된다.
        #   그 URL 은 스토어 심사에 등록돼 있어 조용히 깨지면 안 된다(가드레일 9절).
        #   nginx 최장 접두사 매칭이라 아래 두 블록이 `location /` 보다 먼저 잡힌다.
        location /legal/ {
            root /usr/share/nginx/html;
            index index.html;
        }

        # /download/dodam.apk 는 위에 `location =` 정확일치가 따로 있다(볼륨의 실제 APK).
        # 이 블록은 그 옆의 안내 페이지(index.html·qr.svg)를 계속 서빙한다.
        location /download/ {
            root /usr/share/nginx/html;
            index index.html;
        }

        # 나머지 전부 → 커뮤니티 웹(Next.js standalone). S15P11B209-383
        #   위의 /api/·/ai/·/grafana/·/jenkins/·/legal/·/download/ 가 최장 접두사 매칭으로
        #   항상 먼저 잡히고, 여기까지 내려온 요청만 웹이 받는다.
        #
        #   ⚠️ 변수+resolver 를 쓰지 않고 고정 proxy_pass 다. /jenkins/·/grafana/ 가
        #      변수를 쓰는 건 그 백엔드가 없을 때도 nginx 가 떠야 하기 때문인데,
        #      web 은 같은 kustomize base 에 있어 항상 함께 배포된다. 고정으로 두면
        #      오타·DNS 실패가 기동 시점에 바로 드러나서 오히려 낫다.
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Next 의 HMR 은 운영에 없지만, 향후 스트리밍 응답을 위해 1.1 로 둔다.
            proxy_http_version 1.1;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: dodam
  labels: { app: gateway }
spec:
  # base 는 ClusterIP. 외부 노출 방식은 overlay 가 정한다(운영 포트 사고 방지).
  type: ClusterIP
  selector: { app: gateway }
  ports:
    - { name: http,  port: 80,  targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: dodam
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        # ConfigMap 이 바뀌어도 Deployment 스펙이 그대로면 파드가 재시작하지 않는다.
        # kustomize 의 configMapGenerator 를 쓰면 이름에 해시가 붙어 자동 롤아웃되지만,
        # 여기서는 conf 가 길어 가독성을 택했다 — 대신 conf 수정 후 아래를 반드시 실행한다:
        #   kubectl -n dodam rollout restart deployment/gateway
        dodam.io/conf-reload: "manual"
    spec:
      containers:
        - name: nginx
          image: dodam-nginx        # 태그는 overlay 의 images 트랜스포머가 채운다
          # ⚠️ Always 인 이유 (S15P11B209-771). 기본값 IfNotPresent 는 여기서 위험하다:
          #   `apply -k` 는 이미지를 SHA 태그에서 :prod 로 되돌리는데(overlay 의 images),
          #   그때 kubelet 이 **노드에 캐시된 옛 :prod** 를 재풀 없이 그대로 띄운다.
          #   Jenkins 가 배포마다 레지스트리 :prod 를 갱신하는 방어(359)는 노드 캐시를 못 이긴다.
          #   실제로 2026-08-02·08-04 두 번 터졌다(08-04 는 /login 404, 약 10분).
          #   비용: 레지스트리가 루프백(127.0.0.1:5000)이라 다이제스트만 확인하고 레이어는 캐시 재사용.
          imagePullPolicy: Always
          # ⚠️ nginx 는 시작 시 proxy_pass 의 호스트명을 해석한다. backend/ai Service 가
          #    아직 없으면 기동에 실패하는데, k8s 에는 compose 의 depends_on 이 없다.
          #    → 파드가 CrashLoopBackOff 로 재시도하다 Service 가 생기면 스스로 뜬다(자가 치유).
          #      최초 apply 직후 잠깐 재시작이 보이는 것은 정상이다.
          # 액세스 로그 시각을 KST 로 (S15P11B209-736 후속). nginx 의 `$time_local` 은
          # 컨테이너 로컬 시각을 쓰므로 TZ 가 없으면 UTC 로 찍혀, 장애 조사 때
          # 백엔드 로그·DB 와 9시간 어긋난 것을 사람이 매번 암산해야 한다.
          #
          # ⚠️ 이 값을 바꾸면 gateway 가 재시작한다. gateway 는 hostPort 80/443 이고
          #   `maxSurge: 0` 이라 그 사이 **외부 접속이 수 초간 끊긴다.** 다른 워크로드처럼
          #   무중단이 아니므로, 반영은 트래픽이 적은 시점을 골라 별도로 수행할 것.
          env:
            - { name: TZ, value: "Asia/Seoul" }
          ports:
            - { name: http,  containerPort: 80 }
            - { name: https, containerPort: 443 }
          volumeMounts:
            - { name: conf,        mountPath: /etc/nginx/conf.d }
            - { name: letsencrypt, mountPath: /etc/letsencrypt, readOnly: true }
            - { name: webroot,     mountPath: /var/www/certbot, readOnly: true }
            - { name: apk,         mountPath: /var/www/apk }
          # 프로브는 **80 포트의 `/`** 를 친다. 이유가 두 개다:
          #   ① 443 을 치면 인증서가 아직 없을 때 파드가 영원히 Ready 가 안 된다.
          #      80 은 ACME·리다이렉트 전용이라 인증서와 무관하게 항상 응답한다.
          #   ② `/` 는 `return 301` 이다. k8s httpGet 프로브는 **2xx·3xx 만 성공**으로 보고
          #      404 는 실패로 센다 — /.well-known/acme-challenge/ 로 걸면 (파일이 없어 404라)
          #      영원히 Ready 가 되지 않는다.
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { memory: 32Mi,  cpu: 50m }
            limits:   { memory: 128Mi, cpu: 500m }
      volumes:
        - name: conf
          configMap: { name: gateway-conf }
        - name: letsencrypt
          persistentVolumeClaim: { claimName: letsencrypt }
        - name: webroot
          persistentVolumeClaim: { claimName: certbot-webroot }
