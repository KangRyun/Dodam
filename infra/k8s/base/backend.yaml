# Backend(Spring Boot) — Deployment ×2 (S15P11B209-357)
#
# ★ 무중단 배포의 핵심이 이 파일이다. 나머지는 이걸 위한 배관이다.
#
#   maxUnavailable: 0  — 옛 파드를 **먼저 지우지 않는다**
#   maxSurge: 1        — 새 파드를 하나 더 띄운 뒤,
#                        readinessProbe 가 통과해야 옛 파드를 내린다
#
#   → 배포 중에도 요청을 받을 수 있는 파드가 항상 최소 2개 유지된다.
#     지금 compose 의 `up -d`(죽이고 새로 띄움)와 근본적으로 다른 지점이다.
#     이걸 수치로 증명하는 게 S15P11B209-362 다.
#
# ⚠️ readinessProbe 가 없으면 위 보장이 전부 무의미하다. "떴다"와 "받을 준비가 됐다"는
#    다르다 — 스프링은 포트를 연 뒤에도 한동안 초기화 중이다.
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dodam
  labels: { app: backend }
spec:
  selector: { app: backend }
  ports:
    # 이름을 'backend', 포트를 8080 으로 둔 덕에 nginx conf 의 proxy_pass 를 안 고쳐도 된다.
    - { name: http,       port: 8080, targetPort: 8080 }
    # 관리 포트. actuator 는 8080 이 아니라 9404 에 있다(application.yml management.server.port).
    #   ⚠️ 2026-07-28 실측으로 확인 — 8080/actuator/health 는 404 다.
    #   nginx 가 8080 만 프록시하도록 일부러 분리한 구조이므로, 이 포트는
    #   Service 에는 두되 gateway 에서는 절대 프록시하지 않는다(프로브·Prometheus 전용).
    - { name: management, port: 9404, targetPort: 9404 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dodam
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # ← 무중단의 근거. 0 이 아니면 배포 중 용량이 줄어든다.
  template:
    metadata:
      labels: { app: backend }
    spec:
      # ⚠️ 끄지 않으면 파드가 아예 기동하지 못한다(2026-07-29 스테이징 실측).
      #   kubelet 은 SA 토큰을 /var/run/secrets/kubernetes.io/serviceaccount 에 마운트하는데,
      #   /var/run 은 /run 심링크이고 아래 fcm 볼륨이 /run/secrets 를 **읽기 전용**으로 덮는다.
      #   그 안에 kubernetes.io 디렉터리를 만들려다 read-only 로 실패 → CrashLoopBackOff.
      #   compose 에는 SA 토큰이 없어 드러나지 않던 충돌이다.
      #   끄는 것이 옳은 이유: backend 는 k8s API 를 호출하지 않는다. 토큰을 들고 있을
      #   이유가 없으므로 최소권한에도 부합한다(가드레일 9절).
      automountServiceAccountToken: false
      # 종료 신호를 받은 파드가 처리 중이던 요청을 마칠 시간.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: dodam-backend       # 태그는 overlay 의 images 트랜스포머가 채운다
          envFrom:
            # 비밀 아닌 값 전부. 키 이름이 compose 환경변수와 같아 앱 코드는 그대로다.
            - configMapRef: { name: dodam-config }
          env:
            # 비밀은 개별 참조 — 어떤 키를 쓰는지 매니페스트만 보고 알 수 있게 한다.
            # compose 의 `${VAR:?}` fail-fast 대응: Secret 에 키가 없으면 파드가 뜨지 않는다
            # (optional 을 붙이지 않았으므로). "조용히 저하"되지 않는다.
            - { name: DB_NAME,     valueFrom: { secretKeyRef: { name: dodam-secrets, key: MYSQL_DATABASE } } }
            - { name: DB_USERNAME, valueFrom: { secretKeyRef: { name: dodam-secrets, key: MYSQL_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: dodam-secrets, key: MYSQL_PASSWORD } } }
            - { name: REDIS_PASSWORD,    valueFrom: { secretKeyRef: { name: dodam-secrets, key: REDIS_PASSWORD } } }
            - { name: AI_INTERNAL_TOKEN, valueFrom: { secretKeyRef: { name: dodam-secrets, key: AI_INTERNAL_TOKEN } } }
            - { name: JWT_SECRET,        valueFrom: { secretKeyRef: { name: dodam-secrets, key: JWT_SECRET } } }
            - { name: MINIO_BE_USER,     valueFrom: { secretKeyRef: { name: dodam-secrets, key: MINIO_BE_USER } } }
            - { name: MINIO_BE_PASSWORD, valueFrom: { secretKeyRef: { name: dodam-secrets, key: MINIO_BE_PASSWORD } } }
            # 아래 3개는 미설정이어도 앱이 뜬다(해당 기능만 막힘) → optional: true.
            # compose 의 `${VAR:-}` 비차단 passthrough 와 같은 정책이다.
            - { name: PUSH_DEVICE_TOKEN_ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: dodam-secrets, key: PUSH_DEVICE_TOKEN_ENCRYPTION_KEY, optional: true } } }
            - { name: KAKAO_APP_ID,      valueFrom: { secretKeyRef: { name: dodam-secrets, key: KAKAO_APP_ID,      optional: true } } }
            - { name: GOOGLE_CLIENT_ID,  valueFrom: { secretKeyRef: { name: dodam-secrets, key: GOOGLE_CLIENT_ID,  optional: true } } }
            - { name: APPLE_CLIENT_ID,   valueFrom: { secretKeyRef: { name: dodam-secrets, key: APPLE_CLIENT_ID,   optional: true } } }
            # FCM 은 자격증명 파일 존재 여부로 켜고 끈다(S15P11B209-681).
            - { name: APP_PUSH_FCM_ENABLED, valueFrom: { secretKeyRef: { name: dodam-secrets, key: APP_PUSH_FCM_ENABLED, optional: true } } }
          ports:
            - { name: http,       containerPort: 8080 }
            - { name: management, containerPort: 9404 }
          volumeMounts:
            - { name: storage, mountPath: /app/storage }
            # FCM Service Account — 이 컨테이너에만 읽기 전용으로. 없으면 마운트 자체가 생략된다.
            - { name: fcm, mountPath: /run/secrets, readOnly: true }
          # ── 프로브 (전부 2026-07-28 실측으로 경로 확인) ──────────────────
          #   /actuator/health/liveness  → {"status":"UP"}
          #   /actuator/health/readiness → {"status":"UP"}
          # startupProbe 가 뜨는 동안 liveness·readiness 는 멈춰 있다 — 스프링 부팅(40초 안팎)
          # 중에 liveness 가 파드를 죽이는 것을 막는 장치다.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 9404 }
            periodSeconds: 5
            failureThreshold: 24        # 최대 120초
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 9404 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 9404 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          # 실측 760MB(2026-07-28). replicas 2 → requests 합계 1.5GB.
          # ⚠️ 이 서비스가 메모리 예산의 최대 소비자다. 358(compose 병행) 구간에서는
          #    overlay 가 replicas 를 1 로 낮춘다 — 이유는 overlays/staging 주석 참조.
          resources:
            requests: { memory: 768Mi, cpu: 250m }
            limits:   { memory: 1536Mi, cpu: "2" }
      volumes:
        - name: storage
          # STORAGE_MODE=s3 라 평시엔 거의 쓰이지 않지만, 폴백 경로가 파드 재시작마다
          # 사라지지 않도록 PVC 를 붙인다(가드레일 9절 — 아동 데이터 유실 방지).
          # ⚠️ RWO 라 replicas 2 가 같은 노드에 있을 때만 공유된다. 단일 노드 전제.
          persistentVolumeClaim: { claimName: backend-storage }
        - name: fcm
          secret:
            secretName: dodam-fcm
            optional: true            # 미발급 상태에서도 파드가 뜬다(compose 의 /dev/null 기본값과 동일)
            items:
              - { key: fcm-service-account.json, path: fcm-service-account.json }
---
# PodDisruptionBudget — 노드 드레인·재시작 같은 "자발적 중단" 때도 최소 1개는 남긴다.
# ⚠️ 롤링 배포를 보장하는 건 위의 maxUnavailable: 0 이고, PDB 는 그것과 별개다.
#    PDB 만 두고 maxUnavailable 을 놔두면 배포 중 중단이 생긴다 — 둘 다 필요하다.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: dodam
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: backend }
