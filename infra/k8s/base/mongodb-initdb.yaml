# MongoDB 최초 기동 초기화 (S15P11B209-364)
#
# ⚠️ 이 스크립트는 **데이터 디렉터리가 비어 있을 때 딱 한 번만** 실행된다.
#    mongo 이미지의 entrypoint 가 그렇게 동작한다 — 이미 데이터가 있으면 조용히 건너뛴다.
#    따라서 "스크립트를 고쳤는데 왜 반영이 안 되지?"는 버그가 아니라 사양이다.
#    운영 중 변경(인덱스 추가 등)은 별도 절차로 적용한다(634).
#
# ⚠️ 여기서 만드는 앱 계정은 **해당 DB 에만** 권한을 갖는다(readWrite on dodam).
#    root 는 백업·인덱스 관리용이고 앱은 절대 root 로 붙지 않는다 — 최소권한 원칙.
#    MinIO 의 앱 계정 분리(369)와 같은 구조다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-initdb
  namespace: dodam
data:
  01-app-user.js: |
    // 앱 전용 최소권한 계정 생성 (S15P11B209-364)
    //
    // 값은 컨테이너 환경변수로 들어온다 — 이 파일에 비밀은 없다.
    // entrypoint 가 mongosh 로 실행하므로 process.env 로 읽는다.
    const dbName   = process.env.MONGO_INITDB_DATABASE;
    const appUser  = process.env.MONGO_APP_USERNAME;
    const appPass  = process.env.MONGO_APP_PASSWORD;

    if (!dbName || !appUser || !appPass) {
      // fail-fast — 계정 없이 떠 버리면 앱이 붙는 시점에야 알게 된다.
      //   compose 의 `:?` 가드와 같은 취지: 조용한 반쪽 성공을 만들지 않는다.
      throw new Error(
        'MONGO_INITDB_DATABASE / MONGO_APP_USERNAME / MONGO_APP_PASSWORD 가 필요하다. ' +
        'infra/scripts/sync-secrets.sh 로 dodam-secrets 에 넣었는지 확인할 것.'
      );
    }

    db = db.getSiblingDB(dbName);
    db.createUser({
      user: appUser,
      pwd:  appPass,
      // readWrite 만 준다. dbAdmin(인덱스 생성·삭제)은 주지 않는다 —
      //   인덱스는 이 초기화 스크립트와 634 의 관리 절차에서만 다룬다.
      //   앱이 임의로 인덱스를 만들면 TTL 정책이 코드 곳곳으로 흩어진다.
      roles: [{ role: 'readWrite', db: dbName }],
    });

    print(`✅ 앱 계정 생성: ${appUser} (readWrite on ${dbName})`);

  02-indexes.js: |
    // 인덱스 + TTL (S15P11B209-634)
    //
    // ★ TTL 인덱스가 이 프로젝트에서 갖는 의미
    //   "보관 기간이 지나면 자동 삭제"(가드레일 9절)를 **DB 가 강제**하게 만드는 장치다.
    //   앱 코드나 크론에 맡기면 "삭제 잡이 안 돌았는데 아무도 몰랐다"가 가능해진다.
    //   mongod 가 60초마다 백그라운드로 만료 문서를 지운다 — 앱이 빠져도 계속 동작한다.
    //
    // ⚠️ expireAfterSeconds: 0 + 문서의 expireAt 필드 조합으로 쓴다.
    //   "필드에 적힌 시각이 지나면 삭제"라는 뜻이다. 보관 기간이 데이터 종류마다 다르고
    //   동의 철회 시 앞당겨야 할 수도 있어, 기간을 인덱스에 박지 않고 **문서마다** 들고 간다.
    //   (expireAfterSeconds 에 기간을 박으면 정책이 바뀔 때 인덱스를 다시 만들어야 한다.)
    //
    // ⚠️ TTL 은 "언젠가 지운다"이지 즉시가 아니다(최대 60초 + 부하에 따라 더).
    //   동의 철회·회원 탈퇴는 TTL 을 기다리지 않고 deleteMany({ childId }) 를 즉시 실행한다
    //   — 그래서 childId 인덱스가 필요하다. 없으면 전체 스캔이 된다.
    const dbName = process.env.MONGO_INITDB_DATABASE;
    db = db.getSiblingDB(dbName);

    // ── strokes: 배치 1건 = 문서 1개 (좌표=문서 금지 — ADR 0001)
    db.createCollection('strokes');
    db.strokes.createIndex(
      { sessionId: 1, batchSeq: 1 },
      { unique: true, name: 'session_batch_unique' },
    );
    // unique 인 이유: 네트워크가 불안정한 태블릿에서 같은 배치를 다시 보내는 건 정상 동작이다.
    //   재전송을 앱이 아니라 DB 제약으로 막아, 중복 저장이 구조적으로 불가능하게 한다.

    db.strokes.createIndex({ childId: 1 }, { name: 'child_lookup' });
    db.strokes.createIndex(
      { expireAt: 1 },
      { expireAfterSeconds: 0, name: 'ttl_expire_at' },
    );

    // ── conversation_events: 대화 로그 원문
    //   ⚠️ 이 컬렉션이 대화 원문의 **단일 소스**인지는 아직 미확정이다(365 에서 BE 와 협의).
    //     MySQL conversation_messages 와 이중 저장하면 어느 쪽이 진실인지 모호해진다.
    //     확정 전까지 앱이 양쪽에 쓰지 않도록 할 것(ADR 0001 §결과).
    db.createCollection('conversation_events');
    db.conversation_events.createIndex({ sessionId: 1, seq: 1 }, { name: 'session_seq' });
    db.conversation_events.createIndex({ childId: 1 }, { name: 'child_lookup' });
    db.conversation_events.createIndex(
      { expireAt: 1 },
      { expireAfterSeconds: 0, name: 'ttl_expire_at' },
    );

    print('✅ 인덱스 생성 완료 (strokes 3 · conversation_events 3, TTL 포함)');
