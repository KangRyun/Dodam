# 커뮤니티 웹(Next.js standalone) — Deployment (S15P11B209-383)
#
# 라이브 루트(`/`)를 임시 페이지(S15P11B209-302)에서 이 서비스로 넘긴다.
# gateway 의 `location /` 가 여기로 프록시하고, /api/·/ai/·/grafana/·/jenkins/·/download/
# 는 nginx 최장 접두사 매칭으로 기존 라우트가 계속 우선한다.
#
# ⚠️ 무인증 공개면이다(가드레일 9절). Service 는 ClusterIP — 클러스터 밖으로 열지 않는다.
#    외부 진입은 gateway 하나뿐이어야 한다.
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dodam
  labels: { app: web }
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dodam
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: dodam-web          # 태그는 overlay 의 images 트랜스포머가 채운다
          ports:
            - { name: http, containerPort: 3000 }
          # ⚠️ env 로 API 주소를 넣지 않는다. NEXT_PUBLIC_* 는 빌드 시점에 번들에
          #    구워지므로 여기서 줘도 아무 효과가 없다. 주소를 바꾸려면 build-arg 를
          #    바꿔 **재빌드**해야 한다(frontend/web/Dockerfile 주석 참조).
          #    여기에 env 를 추가하면 "설정했는데 왜 안 바뀌지"로 반나절을 쓴다.
          env:
            - { name: NODE_ENV, value: production }
          # `/` 는 /community 로 리다이렉트한다(src/app/page.tsx). 3xx 는 프로브 성공으로
          # 취급되므로 그대로 쓴다 — 별도 헬스 엔드포인트를 만들 이유가 없다.
          startupProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 20
            failureThreshold: 5
          # standalone 번들은 가볍다. 이 서버는 여유 RAM 이 빠듯하므로(APK 빌드 관문이
          # 가용 7,168MB 를 요구한다) 상한을 낮게 잡았다. 실측 후 조정할 것.
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 500m }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Next 가 .next/cache 에 써야 한다
