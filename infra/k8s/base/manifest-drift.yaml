# 매니페스트 드리프트 감시 — S15P11B209-751
#
# "git 에 있다 ≠ 클러스터에 있다" 를 주기적으로 확인한다.
#
# ★ 왜 Jenkins 가 아니라 CronJob 인가
#   2026-07-30 드리프트는 **빌드가 만든 게 아니다.** 365 가 머지돼 빌드·배포까지 정상으로
#   돌았고, 매니페스트도 옳았다. 다만 아무도 `kubectl apply` 를 하지 않았을 뿐이다.
#   빌드 단계에 붙이면 "빌드가 돌 때만" 보인다. 정작 문제는 **빌드와 무관하게 어긋나 있는
#   상태**이고, 그건 시간이 지나야 드러난다. 그래서 주기 점검으로 둔다.
#
# ★ 알림 경로 — 웹훅을 여기 넣지 않는다
#   드리프트를 찾으면 스크립트가 exit 1 → Job 실패로 남는다. 그 실패를 kube-state-metrics 가
#   `kube_job_status_failed` 로 노출하고, Prometheus 룰이 잡아 Alertmanager → Mattermost 로
#   간다(733 에서 세운 경로). 중복 억제·그룹핑·재알림 주기를 Alertmanager 가 이미 관리하므로
#   시크릿도 하나 덜 쓰고 알림 정책이 한 벌로 유지된다.
#
# ★ 권한이 왜 읽기 전용인가 (설계상 중요)
#   `kubectl diff` 를 쓰면 훨씬 간단하지만, 내부적으로
#       PATCH .../deployments/backend?dryRun=All
#   을 보낸다. 쿠버네티스는 **dry-run 도 실제 쓰기와 동일하게 인가**하므로 오버레이의 모든
#   종류에 patch 권한이 필요해진다 — 거기엔 ClusterRole 도 포함된다.
#   **ClusterRole 을 patch 할 수 있는 잡은 스스로에게 cluster-admin 을 줄 수 있다.**
#   감시용 잡에 줄 권한이 아니라서 diff 를 버리고 get 기반 비교로 갔다.
#   (근거·비교 방식은 infra/scripts/check-manifest-drift.sh 머리주석)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-reader
  namespace: dodam
automountServiceAccountToken: true    # kubectl 이 토큰으로 API 를 읽는다
---
# 네임스페이스 안 리소스 — 오버레이가 담는 종류만. get·list 뿐이고 쓰기 동사는 없다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drift-reader
  namespace: dodam
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  # RBAC 도 매니페스트로 관리하므로 드리프트 대상이다(jenkins-deployer-rbac.yaml).
  #   배포 SA 의 권한이 조용히 어긋나는 건 오히려 더 위험해서 일부러 포함한다.
  #   읽기만 준다 — 읽기는 권한 상승이 아니다(정보 노출일 뿐이고, 단일 테넌트 클러스터다).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-reader
  namespace: dodam
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: drift-reader }
subjects:
  - { kind: ServiceAccount, name: drift-reader, namespace: dodam }
---
# 클러스터 범위 리소스 — 오버레이에 Namespace·ClusterRole·ClusterRoleBinding 이 있다.
# 네임스페이스 한정 Role 로는 읽을 수 없어 ClusterRole 이 필요하다. 역시 읽기만.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dodam-drift-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dodam-drift-reader
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dodam-drift-reader }
subjects:
  - { kind: ServiceAccount, name: drift-reader, namespace: dodam }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: manifest-drift-check
  namespace: dodam
spec:
  # ⚠️⚠️ 기본값이 suspend: true 다. 의도적이다.
  #   선행 조건: Secret `dodam-drift-git` (저장소 읽기 전용 토큰) 이 있어야 한다.
  #     없으면 initContainer 가 CreateContainerConfigError 로 계속 재시도하며 시끄럽다.
  #   푸는 절차:
  #     ① GitLab → 프로젝트 → Settings → Repository → Deploy tokens
  #        scope: read_repository 만. 이름 예: dodam-drift-reader
  #     ② kubectl -n dodam create secret generic dodam-drift-git \
  #          --from-literal=GIT_USERNAME='<토큰 사용자명>' --from-literal=GIT_TOKEN='<토큰>'
  #        (sync-secrets.sh 를 타지 않는다 — 앱 비밀과 수명주기가 다르다. dodam-backup 과 같은 취급)
  #     ③ 수동 1회 실행으로 실증:
  #          kubectl -n dodam create job --from=cronjob/manifest-drift-check drift-once
  #          kubectl -n dodam logs job/drift-once
  #     ④ kubectl -n dodam patch cronjob manifest-drift-check -p '{"spec":{"suspend":false}}'
  #   ※ 풀기를 잊어도 ManifestDriftCheckSuspended 경보가 24시간 뒤 알린다(monitoring-prometheus.yaml).
  #      "스케줄 유무 ≠ 동작 여부" — 733 에서 배운 것을 여기에도 적용한다.
  suspend: true
  timeZone: "Asia/Seoul"
  schedule: "20 * * * *"          # 매시 20분. 백업(04:00·04:30·*/6 30분)과 겹치지 않게 뗐다.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 0 = 재시도 없음. 드리프트는 다시 돌린다고 사라지지 않는다. 재시도하면 실패 잡이
      #   여러 개 쌓여 경보만 부풀고, 사람이 봐야 한다는 사실은 그대로다.
      backoffLimit: 0
      ttlSecondsAfterFinished: 259200   # 3일
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: drift-reader
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532              # emptyDir 을 비루트가 쓰기 위해 필요하다
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            # 저장소를 받아온다. **토큰은 이 컨테이너에만 있다** — kubectl 을 돌리는 본 컨테이너의
            # 환경에는 들어가지 않는다(권한 분리).
            - name: fetch
              image: alpine/k8s:1.34.1   # latest 금지 — 프로젝트 관례
              env:
                - { name: HOME, value: /work }
                - name: GIT_USERNAME
                  valueFrom: { secretKeyRef: { name: dodam-drift-git, key: GIT_USERNAME } }
                - name: GIT_TOKEN
                  valueFrom: { secretKeyRef: { name: dodam-drift-git, key: GIT_TOKEN } }
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  # 토큰을 URL 에 넣지 않는다 — argv 와 로그에 남는다(아동 서비스 가드레일 9절과
                  # 같은 취지: 비밀은 화면·로그에 나오지 않는다). credential store 로 넘긴다.
                  umask 077
                  printf 'https://%s:%s@lab.ssafy.com\n' "${GIT_USERNAME}" "${GIT_TOKEN}" > /work/.git-credentials
                  git config --global credential.helper store
                  git config --global --add safe.directory /work/repo
                  git clone --depth 1 --branch develop --quiet \
                    https://lab.ssafy.com/s15-webmobile2-sub1/S15P11B209.git /work/repo
                  rm -f /work/.git-credentials          # 본 컨테이너로 넘기지 않는다
                  echo "clone OK — $(git -C /work/repo rev-parse --short HEAD)"
              volumeMounts: [{ name: work, mountPath: /work }]
              resources:
                requests: { cpu: 50m,  memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
          containers:
            - name: check
              image: alpine/k8s:1.34.1
              workingDir: /work/repo
              env:
                - { name: HOME, value: /work }
                - { name: OVERLAY, value: infra/k8s/overlays/prod }
              command: ["/bin/bash", "-c"]
              args:
                - |
                  # 스크립트는 저장소에 있다 — 매니페스트와 같은 커밋으로 움직인다.
                  # 종료 코드 1(드리프트)·2(점검 실패) 모두 Job 실패로 남고 경보가 뜬다.
                  # 어느 쪽인지는 로그를 봐야 한다(메트릭에는 종료 코드가 노출되지 않는다).
                  exec ./infra/scripts/check-manifest-drift.sh
              volumeMounts: [{ name: work, mountPath: /work }]
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits:   { cpu: 1,    memory: 512Mi }
