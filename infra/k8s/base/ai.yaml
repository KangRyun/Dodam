# AI 분석 서버(FastAPI) — Deployment (S15P11B209-357)
#
# 상태가 없어 Deployment 로 간다. 가중치(*.pt)만 읽기 전용 볼륨으로 주입한다.
#
# ⚠️ 아동 음성·발화가 지나가는 서비스다(가드레일 9절).
#    Service 는 ClusterIP — 클러스터 밖으로 열지 않는다. 외부 진입은 gateway 의 /ai/ 뿐이다.
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: dodam
  labels: { app: ai }
spec:
  selector: { app: ai }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: dodam
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: ai }
    spec:
      containers:
        - name: ai
          image: dodam-ai          # 태그는 overlay 의 images 트랜스포머가 채운다
          envFrom:
            - configMapRef: { name: dodam-config }
          env:
            - { name: GMS_KEY,           valueFrom: { secretKeyRef: { name: dodam-secrets, key: GMS_KEY } } }
            - { name: GMS_BASE_URL,      valueFrom: { secretKeyRef: { name: dodam-secrets, key: GMS_BASE_URL } } }
            - { name: AI_INTERNAL_TOKEN, valueFrom: { secretKeyRef: { name: dodam-secrets, key: AI_INTERNAL_TOKEN } } }
          ports:
            - { name: http, containerPort: 8000 }
          volumeMounts:
            # :ro — 추론만 하므로 쓰기 권한을 주지 않는다(최소권한, compose 와 동일).
            - { name: models, mountPath: /models, readOnly: true }
          # /health → {"status":"ok"} — 2026-07-28 실측 확인.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 3
            failureThreshold: 20     # import(openai·pydantic) 로딩 여유
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            failureThreshold: 5
          # 실측 근거: docs/ai/yolo-cpu-benchmark-2026-08.md (S15P11B209-609)
          #   두 모델 로드 + imgsz 960 추론 시 메모리 피크 1.75Gi — 1Gi 상한은 첫 실분석에서
          #   OOMKilled 됨(동일 이미지·cgroup 조건 벤치로 재현). 2026-07-30 의 1Gi 상향이
          #   버텼던 건 sketch imgsz 640 시절 트래픽 기준이라 960(761) 이후엔 무효.
          #   cpu 2: 추론 p50 1.5s → 0.6~1.1s (1.6~2.5×). limit 은 예약이 아니라 상한 —
          #   분석은 간헐 버스트라 4코어 호스트에서 상시 경합 없음.
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits:   { memory: 2Gi,   cpu: "2" }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ai-models }
