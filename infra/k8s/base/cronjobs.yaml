# 주기 작업 — certbot 갱신 · DB 백업 (S15P11B209-357)
#
# compose 에서는 둘 다 "무한 루프 컨테이너"와 "호스트 cron"이었다.
# k8s 에서는 CronJob 이 제자리다 — 실행 이력·실패 여부가 리소스로 남아 관측이 된다.
---
# ── certbot 인증서 갱신 ──────────────────────────────────────────────────────
# compose 의 `while true; do certbot renew; sleep 12h; done` 을 CronJob 으로 옮긴 것.
# 실제 갱신은 만료 30일 전부터만 일어나고 그 외에는 no-op 이라, 하루 두 번은 안전하다.
#
# ⚠️ 최초 발급은 이 CronJob 이 하지 않는다(renew 는 기존 인증서만 갱신한다).
#    360 컷오버 시 compose 의 letsencrypt 볼륨 내용을 PVC 로 이관하거나,
#    certonly 를 한 번 수동 실행해야 한다. 이관 없이 prod overlay 를 올리면 TLS 가 깨진다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: certbot-renew
  namespace: dodam
spec:
  schedule: "17 3,15 * * *"       # 하루 2회. 정시를 피해 LE 서버 부하 집중을 피한다.
  concurrencyPolicy: Forbid       # 이전 실행이 안 끝났으면 건너뛴다(인증서 파일 동시 쓰기 방지)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: certbot
              image: certbot/certbot:v2.11.0   # latest 금지 — compose 와 동일 태그
              args: ["renew", "--webroot", "-w", "/var/www/certbot"]
              volumeMounts:
                - { name: letsencrypt, mountPath: /etc/letsencrypt }
                - { name: webroot,     mountPath: /var/www/certbot }
              resources:
                requests: { memory: 64Mi,  cpu: 50m }
                limits:   { memory: 256Mi, cpu: 500m }
          volumes:
            - name: letsencrypt
              persistentVolumeClaim: { claimName: letsencrypt }
            - name: webroot
              persistentVolumeClaim: { claimName: certbot-webroot }
---
# ── MySQL 백업 ──────────────────────────────────────────────────────────────
# ⚠️⚠️ 기본값이 suspend: true 다. 의도적이다.
#
#   백업은 "돌고 있다"가 아니라 "복원된다"로만 검증된다. 오늘(2026-07-28)만 해도
#   `OK size=4.0K` 로 성공을 알리던 백업이 실제로는 빈 파일이었던 사례가 있었다(374).
#   그래서 아래 두 가지가 끝나기 전에는 켜지 않는다:
#     ① Secret `dodam-backup` 에 BACKUP_PASSPHRASE 존재
#        (호스트 /etc/dodam/backup-passphrase 와 **같은 값** — 기존 백업과 복호화 호환)
#     ② 이 CronJob 산출물로 복원 드릴 1회 성공
#   켜는 법: overlay 에서 spec.suspend: false 로 패치.
#
#   그때까지는 호스트 cron 의 mysql-backup.sh 가 계속 담당한다(둘을 동시에 켜지 말 것 —
#   같은 시간대에 두 벌이 돌면 DB 부하만 두 배가 된다).
#
# ⚠️ 백업 파일 = 아동 민감정보. 서버 밖 반출·전송 금지(가드레일 9절).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: dodam
spec:
  suspend: true                   # ← 위 ①②가 끝나기 전에는 켜지 않는다
  schedule: "0 4 * * *"           # 호스트 cron 과 같은 시각(전환 시 혼동 방지)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mysql:8.4.10       # mysqldump 를 쓰기 위해 DB 와 동일 이미지·버전
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  STAMP="$(date +%F-%H%M)"
                  OUT="/backup/mysql-${STAMP}.sql.gz.enc"
                  # --single-transaction: InnoDB 를 잠그지 않고 일관된 스냅샷을 뜬다(서비스 무영향)
                  mysqldump --single-transaction --routines --triggers \
                    -h mysql -u root -p"${MYSQL_ROOT_PASSWORD}" "${MYSQL_DATABASE}" \
                    | gzip \
                    | openssl enc -aes-256-cbc -pbkdf2 -md sha256 -iter 200000 \
                        -pass "env:BACKUP_PASSPHRASE" -out "${OUT}.part"
                  mv "${OUT}.part" "${OUT}"
                  # ★ 크기가 아니라 "내용이 있는가"를 본다. 빈 백업이 성공으로 보고되는 걸 막는다(374 교훈).
                  BYTES="$(stat -c %s "${OUT}")"
                  if [ "${BYTES}" -lt 1024 ]; then
                    echo "[db-backup] FAIL 백업이 비어 있습니다 bytes=${BYTES}" >&2
                    exit 1
                  fi
                  find /backup -maxdepth 1 -name 'mysql-*.sql.gz.enc' -mtime +14 -delete
                  echo "[db-backup] OK file=${OUT} bytes=${BYTES} retention=14d"
              env:
                - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: dodam-secrets, key: MYSQL_ROOT_PASSWORD } } }
                - { name: MYSQL_DATABASE,      valueFrom: { secretKeyRef: { name: dodam-secrets, key: MYSQL_DATABASE } } }
                # 별도 Secret — 백업 암호는 앱 비밀과 수명주기가 다르다(교체하면 옛 백업 복호화 불가).
                - { name: BACKUP_PASSPHRASE,   valueFrom: { secretKeyRef: { name: dodam-backup,  key: BACKUP_PASSPHRASE } } }
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { memory: 128Mi, cpu: 100m }
                limits:   { memory: 512Mi, cpu: "1" }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: db-backup }
---
# MongoDB 백업 (S15P11B209-634)
#
# db-backup(MySQL)과 같은 규정으로 다룬다 — 저장소가 늘었다고 백업 방식이 갈리면
# 운영 절차가 두 벌이 되고, 급할 때 어느 쪽 절차인지 헷갈린다.
#   같은 것: 암호화(AES-256) · 같은 PVC · 14일 보관 · **빈 백업을 성공으로 보고하지 않기**
#   다른 것: mongodump 는 디렉터리를 만들므로 tar 로 묶은 뒤 암호화한다.
#
# ⚠️ suspend: true — 아직 켜지 않는다. MongoDB 워크로드 자체가 배포되지 않은 상태에서
#    스케줄이 돌면 매번 실패 알림만 쌓인다. 364 적용 + 앱 전환(365) 후에 해제한다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  namespace: dodam
spec:
  suspend: true
  schedule: "30 4 * * *"          # MySQL 백업(04:00)과 30분 띄운다 — 동시 실행 시 I/O·메모리 경합
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mongo:8.0.4        # mongodump 를 쓰기 위해 DB 와 동일 이미지·버전
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  STAMP="$(date +%F-%H%M)"
                  OUT="/backup/mongo-${STAMP}.tar.gz.enc"
                  WORK="$(mktemp -d)"
                  trap 'rm -rf "${WORK}"' EXIT   # 평문 덤프를 남기지 않는다(아동 대화 원문 포함)

                  # --authenticationDatabase admin: root 계정은 admin DB 에 있다.
                  #   이걸 빠뜨리면 "인증 실패"가 아니라 "사용자 없음"으로 나와 원인을 헷갈린다.
                  mongodump --host mongodb --port 27017 \
                    --username "${MONGO_ROOT_USERNAME}" \
                    --password "${MONGO_ROOT_PASSWORD}" \
                    --authenticationDatabase admin \
                    --db "${MONGO_DATABASE}" \
                    --out "${WORK}/dump"

                  tar -czf - -C "${WORK}" dump \
                    | openssl enc -aes-256-cbc -pbkdf2 -md sha256 -iter 200000 \
                        -pass "env:BACKUP_PASSPHRASE" -out "${OUT}.part"
                  mv "${OUT}.part" "${OUT}"

                  # ★ 크기만 보지 않는다. mongodump 는 컬렉션이 0건이어도 성공하고,
                  #   빈 덤프도 tar+gzip 하면 수백 바이트가 나온다 — "OK size=4.0K 인데 빈 파일"이
                  #   374 에서 실제로 겪은 실패 양상이다. 덤프 안 BSON 파일 개수를 함께 센다.
                  DOCS="$(find "${WORK}/dump" -name '*.bson' | wc -l)"
                  BYTES="$(stat -c %s "${OUT}")"
                  if [ "${BYTES}" -lt 1024 ] || [ "${DOCS}" -eq 0 ]; then
                    echo "[mongo-backup] FAIL 백업이 비어 있습니다 bytes=${BYTES} collections=${DOCS}" >&2
                    exit 1
                  fi

                  find /backup -maxdepth 1 -name 'mongo-*.tar.gz.enc' -mtime +14 -delete
                  echo "[mongo-backup] OK file=${OUT} bytes=${BYTES} collections=${DOCS} retention=14d"
              env:
                - { name: MONGO_ROOT_USERNAME, valueFrom: { secretKeyRef: { name: dodam-secrets, key: MONGO_ROOT_USERNAME } } }
                - { name: MONGO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: dodam-secrets, key: MONGO_ROOT_PASSWORD } } }
                - { name: MONGO_DATABASE,      valueFrom: { secretKeyRef: { name: dodam-secrets, key: MONGO_DATABASE } } }
                # MySQL 백업과 같은 패스프레이즈 Secret — 복원 절차를 한 벌로 유지한다.
                - { name: BACKUP_PASSPHRASE,   valueFrom: { secretKeyRef: { name: dodam-backup,  key: BACKUP_PASSPHRASE } } }
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { memory: 128Mi, cpu: 100m }
                limits:   { memory: 512Mi, cpu: "1" }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: db-backup }
