# MongoDB 8.0 — StatefulSet (S15P11B209-364)
#
# 무엇을 담나: 스트로크(그리기 과정)와 대화 로그 원문.
#   채택 근거·기각한 대안은 docs/adr/0001-mongodb-adoption.md 참조.
#   요약하면 (1) 배치=문서 임베딩으로 좌표당 인덱스 갱신이 사라지고
#            (2) TTL 인덱스가 네이티브라 **보관 기간을 코드가 아니라 DB 가 강제**한다(가드레일 9절).
#
# 왜 Deployment 가 아니라 StatefulSet 인가 — mysql.yaml 과 같은 이유다.
#   Deployment 는 롤링 중 새 파드를 먼저 띄운다. 같은 디스크를 두 mongod 가 잡으면
#   WiredTiger 가 잠금 파일 충돌로 기동에 실패하거나, 최악의 경우 데이터가 깨진다.
#
# ⚠️ 이 매니페스트는 **빈 PVC** 로 시작한다. 컷오버(360) 때 옮길 기존 데이터는 없다 —
#    Mongo 는 신규 도입이라 compose 쪽에 원본이 존재하지 않는다.
#    (MySQL·MinIO 와 다른 점: 그쪽은 이관이 최대 난제지만 여기는 처음부터 빈 채로 시작한다.)
#
# ⚠️ 단일 노드다. replica set 을 구성하지 않았다.
#    트레이드오프: replica set 이 없으면 **트랜잭션과 change stream 을 쓸 수 없다.**
#    지금 용도(append-only 로그 적재 + 세션 단위 조회)에는 둘 다 필요 없고,
#    단일 노드 EC2 에서 replica set 3개를 띄우는 건 메모리 예산상 불가능하다
#    (docs/인프라/메모리-OOM-대응.md 예산표 참조).
#    나중에 트랜잭션이 필요해지면 단일 노드 replica set(rs0, 멤버 1개)으로 승격하면 된다.
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: dodam
  labels: { app: mongodb }
spec:
  # headless — StatefulSet 파드에 안정적인 DNS 이름을 준다.
  # 이름을 'mongodb' 로 둬서 backend 는 mongodb://mongodb:27017 로 붙는다.
  #   ⚠️ ClusterIP 전용이다. 호스트 포트를 열지 않는다 — 아동 그림·대화 원문이 들어가는 DB 의
  #      외부 노출면은 0 이어야 한다(가드레일 9절, MySQL·MinIO 와 동일 원칙).
  clusterIP: None
  selector: { app: mongodb }
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: dodam
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      # 종료 신호를 받으면 WiredTiger 가 체크포인트를 마칠 시간을 준다.
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongodb
          image: mongo:8.0.4          # latest 금지 — 버전 고정(재현성). 업그레이드는 별도 판단.
          args:
            # ★ 인증 필수. 이 플래그가 없으면 내부망 누구나 무인증으로 붙는다.
            #   MinIO·MySQL 과 같은 원칙이다 — "내부망이니까 괜찮다"로 넘어가지 않는다.
            - --auth
            # WiredTiger 캐시 상한. 기본값은 (RAM-1GB)의 50% 라 호스트 15.6GB 기준 약 7GB 를
            # 잡으려 든다 — 이 서버에서는 그대로 두면 예산을 통째로 먹는다(07-28 OOM 교훈).
            #   아래 limits(1Gi)와 짝이다. 캐시가 상한보다 크면 컨테이너가 OOMKill 된다.
            - --wiredTigerCacheSizeGB
            - "0.4"
          env:
            # 값은 Secret 에서만 온다. 이 파일에 비밀은 한 글자도 없다.
            #   root 계정 = 관리용(백업·인덱스 생성). 앱은 이 계정을 쓰지 않는다.
            - { name: MONGO_INITDB_ROOT_USERNAME, valueFrom: { secretKeyRef: { name: dodam-secrets, key: MONGO_ROOT_USERNAME } } }
            - { name: MONGO_INITDB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: dodam-secrets, key: MONGO_ROOT_PASSWORD } } }
            - { name: MONGO_INITDB_DATABASE,      valueFrom: { secretKeyRef: { name: dodam-secrets, key: MONGO_DATABASE } } }
            # 앱 전용 계정 — 초기화 스크립트(mongodb-initdb.yaml)가 이 값으로 계정을 만든다.
            #   root 와 분리하는 이유는 최소권한(가드레일 9절). 앱은 root 로 붙지 않는다.
            - { name: MONGO_APP_USERNAME,         valueFrom: { secretKeyRef: { name: dodam-secrets, key: MONGO_APP_USERNAME } } }
            - { name: MONGO_APP_PASSWORD,         valueFrom: { secretKeyRef: { name: dodam-secrets, key: MONGO_APP_PASSWORD } } }
          ports:
            - { name: mongodb, containerPort: 27017 }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            # 최초 기동 시 1회 실행되는 초기화 스크립트(앱 계정 생성 + TTL 인덱스).
            #   ⚠️ mongo 이미지는 /docker-entrypoint-initdb.d 를 **데이터 디렉터리가 비어 있을 때만**
            #      실행한다. 이미 데이터가 있으면 조용히 건너뛴다 — 스크립트를 고쳐도 반영 안 된다.
            #      운영 중 변경은 634 의 인덱스 관리 절차로 별도 적용할 것.
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          # ★ 프로브 역할 분담 (S15P11B209-987 — 2026-08-06 실장애로 재설계)
          #
          #   mongosh 는 **startupProbe 에서만** 쓴다. Node.js CLI 라 프로세스를 새로 띄우는
          #   것만으로 수 초가 걸리고, 그 비용을 상시 프로브에 물리면 서버가 멀쩡한데도
          #   프로브가 잘린다. mysql(mysqladmin)·redis(redis-cli)가 멀쩡한 이유는 그쪽
          #   프로브가 C 바이너리라 기동이 사실상 공짜이기 때문이다 — mongodb 만 유별났다.
          #
          #   2026-08-06 실장애: readiness(5s)·liveness(5s)가 CPU 경합 중 동시에 잘리면서
          #   6시간 동안 42회 재시작. readiness 실패가 엔드포인트를 지우자 backend 의
          #   DNS 조회가 UnknownHostException 으로 떨어져 **그림 저장이 500 으로 실패**했다:
          #     StrokeBatchService.save → MongoSocketException: mongodb: Name or service not known
          #   서버는 한 번도 죽지 않았다(exit=0, kubelet 이 죽였다). 프로브가 장애의 원인이었다.
          #
          #   07-30 컷오버 때 같은 원인(mongosh 가 느리다)으로 startupProbe 가 터졌는데,
          #   그때는 timeoutSeconds 만 붙이고 readiness·liveness 의 5초는 그대로 뒀다.
          #   같은 사고를 두 번 냈으므로 이번에는 **프로브 도구 자체를 바꾼다.**
          startupProbe:
            # 기동 완료 판정은 실제 명령이 도는지 봐야 한다 — 최초 기동은 데이터 디렉터리
            # 초기화 + init 스크립트로 수십 초가 걸리고, 포트만 열린 상태와 구분해야 한다.
            # 여기서만 mongosh 를 쓰고, 대신 시간을 넉넉히 준다(최대 300초).
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] }
            periodSeconds: 10
            failureThreshold: 30       # 최대 300초
            # 기본값은 1초다. mongosh 는 Node.js CLI 라 기동만으로 그것을 넘긴다.
            timeoutSeconds: 30
          readinessProbe:
            # startup 이 통과한 뒤에는 소켓 생존만 본다. 이 프로브가 실패하면 엔드포인트가
            # 지워지고 **mongodb 라는 이름 자체가 DNS 에서 사라진다** — 오탐 비용이 가장 큰
            # 자리라 가장 가벼운 검사를 둔다.
            tcpSocket: { port: 27017 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # 재시작을 유발하는 자리다. 오탐 한 번이 곧 커넥션 단절이므로 소켓 검사로 두고
            # 실패 임계도 넉넉히 준다(5회 × 30초 = 2.5분 무응답이어야 재시작).
            tcpSocket: { port: 27017 }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          # 실사용 예측: 문서가 append 되는 만큼 캐시가 늘지만 위에서 0.4GB 로 묶어 뒀다.
          #   나머지는 연결·인덱스·힙. DB 는 OOMKill 이 가장 위험하므로 캐시 상한보다 여유를 둔다.
          #   ⚠️ limits 를 올릴 때는 --wiredTigerCacheSizeGB 도 함께 본다. 한쪽만 올리면
          #      "메모리를 줬는데 캐시는 그대로"이거나 "캐시가 상한을 넘겨 죽는" 상태가 된다.
          #
          #   ⚠️ cpu 상한은 프로브와 함께 봐야 한다 (987). 4코어 노드에서 500m 는 1/8 이라,
          #      노드가 바쁠 때 mongosh 기동이 상한에 눌려 startupProbe 까지 잘렸다.
          #      1500m 는 평소 쓰지 않는 상한이고(요청은 100m 그대로), 기동·경합 구간에서만
          #      숨통을 틔우는 값이다.
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits:   { memory: 1Gi,   cpu: 1500m }
      volumes:
        - name: initdb
          configMap:
            name: mongodb-initdb
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path   # k3s 기본 프로비저너
        resources:
          # 스트로크는 좌표가 많아 커진다. 다만 TTL 로 만료되므로 무한 증가는 아니다.
          # 10Gi 는 MySQL 과 같은 값 — 실측 후 재조정한다(늘리는 건 되지만 줄이는 건 안 된다).
          requests: { storage: 10Gi }
