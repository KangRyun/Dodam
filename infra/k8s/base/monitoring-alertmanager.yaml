# Alertmanager — 경보 통보 경로 (S15P11B209-733)
#
# ★ 왜 이제서야 추가하는가
#   361 에서 Prometheus 와 경보 룰(memory.yml)을 옮겼지만 **Alertmanager 를 두지 않았다.**
#   그래서 HostMemoryAvailableLow·Critical·SwapUsageHigh 세 룰은 지금까지
#   Prometheus /alerts 화면에서 FIRING 으로 보이기만 하고 **아무데도 통보되지 않았다.**
#   룰이 있는 것과 알림이 오는 것은 다르다 — 이 저장소가 반복해서 데이는 지점이다.
#
#   733 이 이걸 건드리는 이유: 백업 실패를 "로그만 남기지 않고" 알려야 하는데,
#   호스트 cron 이 /var/log/dodam-backup.log 에만 남겨서 2026-07-30 새벽에
#   **백업 4종이 전부 죽을 예정인 것을 아무도 몰랐다.** 통보 경로가 없으면
#   CronJob 으로 옮겨도 같은 일이 반복된다. 백업 룰만 넣고 받을 곳을 안 만들면
#   형식만 채우고 문제는 그대로 남는다.
#
# ★ Mattermost 로 어떻게 보내는가
#   Mattermost 의 incoming webhook 은 **Slack 페이로드와 호환**된다. 그래서
#   webhook_configs(Alertmanager 고유 JSON — Mattermost 가 파싱 못 한다)가 아니라
#   slack_configs 를 쓴다.
#   `channel` 은 **일부러 비워 뒀다.** amtool check-config 로 v0.28.1 에서 선택 항목임을
#   확인했고, 생략하면 웹훅에 설정된 기본 채널로 간다 — infra/scripts/memory-guard.sh 가
#   이미 그렇게 쓰고 있어(채널 미지정 `{"text":...}`) 통보 지점이 한 벌로 유지된다.
#
# ⚠️ 웹훅 URL 은 argv 나 ConfigMap 에 두지 않는다. Secret 을 파일로 마운트해
#    slack_api_url_file 로 읽는다. dodam-secrets 의 MATTERMOST_WEBHOOK 은
#    2026-07-30 기준 raw=trim=58 로 **오염되지 않은 값**임을 확인했다(731 대상 아님).
#    ⚠️ 이 값에 꼬리 공백이 붙으면 URL 이 무효가 되고 **조용히 발송만 실패한다** —
#       730 과 같은 결이다. 값을 교체할 때는 `wc -c` 로 대조할 것.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: dodam
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # 파일 경유 — 값이 프로세스 인자나 설정 파일에 남지 않는다.
      slack_api_url_file: /etc/alertmanager/secret/webhook

    route:
      receiver: mattermost
      # alertname 으로만 묶는다. 백업 잡은 실행마다 job_name 이 달라서(job-<epoch>)
      # job_name 을 group_by 에 넣으면 매 실행이 새 그룹이 되어 묶임이 무의미해진다.
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # 백업 실패는 하루 한 번만 관측되는 사건이다. 12시간 반복이면 놓칠 수 있어 짧게 준다.
        - matchers: ['category="backup"']
          receiver: mattermost
          repeat_interval: 4h
        - matchers: ['severity="critical"']
          receiver: mattermost
          repeat_interval: 1h

    receivers:
      - name: mattermost
        slack_configs:
          # channel 미지정 — 웹훅 기본 채널로 간다(위 주석 참조).
          - send_resolved: true
            title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ if .Annotations.description }}{{ .Annotations.description }}
              {{ end }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: dodam
  labels: { app: alertmanager }
spec:
  # ClusterIP 전용 — 경보 화면을 외부에 열지 않는다. 내용에 호스트·파드 이름이 들어간다.
  selector: { app: alertmanager }
  ports:
    - { name: http, port: 9093, targetPort: 9093 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: dodam
  labels: { app: alertmanager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1   # latest 금지 — 설정 스키마가 버전에 묶인다
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - { name: http, containerPort: 9093 }
          env:
            - { name: TZ, value: "Asia/Seoul" }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml }
            - { name: secret, mountPath: /etc/alertmanager/secret, readOnly: true }
            - { name: data,   mountPath: /alertmanager }
          # 프로브 timeout 을 명시한다 — 기본값 1초는 너무 짧아 부하 시 오탐한다(361 교훈).
          readinessProbe:
            httpGet: { path: /-/ready, port: 9093 }
            initialDelaySeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9093 }
            initialDelaySeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { memory: 48Mi,  cpu: 20m }
            limits:   { memory: 128Mi, cpu: 200m }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        # Secret 은 kustomize 밖에서 관리된다(sync-secrets.sh). 여기서는 참조만 한다.
        - name: secret
          secret:
            secretName: dodam-secrets
            items:
              - { key: MATTERMOST_WEBHOOK, path: webhook }
        # 알림 상태(억제·중복 제거 이력)는 재시작하면 잃어도 된다 — 룰이 다시 발동시킨다.
        - name: data
          emptyDir: { sizeLimit: 128Mi }
