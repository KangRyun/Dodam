# 도담 리버스 프록시 — nginx 컨테이너가 이 파일을 include(/etc/nginx/conf.d/*.conf).
# 관련 이슈: S15P11B209-185 (docker-compose 서비스 골격) · S15P11B209-188 (ai 서비스 프록시)
# 원칙: 외부 진입은 nginx만. /api 는 backend로 프록시. 업로드 한도는 그림/음성 고려해 명시.

server {
    listen 80;
    server_name _;                 # 도메인 미지정(기본). 운영 도메인 확정 시 교체

    # 그림/음성 업로드 여유 — 기본 1m로는 이미지가 막힘. 필요 시 상향.
    client_max_body_size 20m;

    # /api/* → backend 컨테이너(내부망 DNS 이름 'backend', 포트 8080)
    location /api/ {
        proxy_pass http://backend:8080;             # 경로 접두 /api 유지한 채 전달
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /ai/* → ai 분석 서비스(내부망 DNS 'ai', 포트 8000)
    #   ★ proxy_pass 끝의 '/' 가 핵심: location 접두(/ai/)를 떼고 전달한다.
    #     예) 외부 /ai/tts  →  ai 컨테이너 /tts   (ai 라우트는 루트 기준: /health,/stt,/tts,/analyze/*)
    #     (/api 는 반대로 접두를 유지 — backend 라우트가 /api 하위라 proxy_pass 에 '/' 없음)
    location /ai/ {
        proxy_pass http://ai:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 추론(STT·대화LLM·TTS를 GMS로 호출)은 응답이 느릴 수 있어 기본 60s→상향.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 프론트 정적 서빙 도입 전 기본 응답. (프론트 연결 시 root/try_files 로 교체)
    location / {
        return 404;
    }
}
