# 도담 리버스 프록시 — nginx 컨테이너가 이 파일을 include(/etc/nginx/conf.d/*.conf).
# 관련 이슈: S15P11B209-185 (compose 골격) · S15P11B209-188 (ai 프록시) · S15P11B209-300 (하드닝) · S15P11B209-301 (HTTPS)
# 구조: 80 = ACME 챌린지 + https 리다이렉트 전용 · 443 = TLS 종단 + 실서비스.
# ⚠️ 이 파일은 이미지에 bake됨(infra/nginx/Dockerfile) — 수정 후 커밋하면 파이프라인이 재빌드·재배포.

# http 컨텍스트 공통(conf.d는 http 안에 include됨) — 모든 서버 블록에서 버전 노출 차단.
server_tokens off;

# ── 80: ACME 챌린지 서빙 + 나머지는 전부 https로 ─────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지 (S15P11B209-301) — certbot이 써놓은 검증 토큰을 서빙.
    #   ⚠️ 인증서 "갱신"이 계속 80을 통하므로 https 전환 후에도 이 location은 영구 유지.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 전부 https로 (301 영구 리다이렉트 — 아동 데이터는 평문 http로 다니지 않는다)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443: TLS 종단 + 리버스 프록시(실서비스) ─────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name i15b209.p.ssafy.io;

    # Let's Encrypt 인증서 — 네임드 볼륨(letsencrypt) 마운트, 저장소엔 절대 커밋하지 않음(가드레일).
    ssl_certificate     /etc/letsencrypt/live/i15b209.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15b209.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;          # 구식 프로토콜(1.0/1.1) 차단
    ssl_prefer_server_ciphers off;          # TLS1.3 권장 — 클라이언트 암호 선호 존중
    ssl_session_cache shared:SSL:10m;       # 핸드셰이크 재사용(성능)
    ssl_session_timeout 1d;

    # 그림/음성 업로드 여유 — 기본 1m로는 이미지가 막힘. 필요 시 상향.
    client_max_body_size 20m;

    # 기본 보안 헤더 (S15P11B209-300).
    #   ⚠️ nginx add_header는 location 블록에 자체 add_header가 생기면 상속이 끊긴다 —
    #      location에 add_header를 추가할 일이 생기면 이 블록도 함께 복사할 것.
    add_header X-Content-Type-Options nosniff always;                   # MIME 스니핑 방지
    add_header X-Frame-Options SAMEORIGIN always;                       # 클릭재킹 방지
    add_header Referrer-Policy strict-origin-when-cross-origin always;  # 경로 정보 유출 최소화
    # HSTS — 브라우저가 1년간 https만 쓰도록 고정(다운그레이드 공격 방지). 아동 데이터 전송 보호.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # /api/* → backend 컨테이너(내부망 DNS 'backend', 8080). 경로 접두 /api 유지한 채 전달.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── BE↔AI 내부 계약 경로 외부 차단 (safety review C-183-1) ────────
    #   reason: 아래 /ai/ 프록시는 접두를 떼고 전달하므로, 외부에서
    #   /ai/internal/ai/v1/... 을 치면 ai 컨테이너의 /internal/ai/v1/...
    #   (BE 전용 내부 계약 — 대화 질문 생성 등)에 그대로 도달한다.
    #   내부 계약은 dodam-net 안에서 backend → ai:8000 직결로만 호출하며(nginx 미경유),
    #   외부에는 404로 경로 존재 자체를 숨긴다(403은 "있다"는 힌트가 됨).
    #   nginx는 최장 접두 매칭 — /ai/internal/ 이 /ai/ 보다 길어 이 블록이 우선한다.
    location /ai/internal/ {
        # ⚠️ location에 add_header가 생기면 서버 블록의 add_header 상속이 끊긴다(위 주석)
        #    — 보안 헤더 3종 + HSTS를 그대로 복사해 이 응답에도 유지한다.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    # ── Prometheus 메트릭 엔드포인트 외부 차단 (S15P11B209-351) ────────
    #   reason: 아래 /ai/ 프록시는 접두를 떼고 전달하므로, 외부에서 /ai/metrics 를 치면
    #   ai 컨테이너의 /metrics(요청 지연·에러율 등 내부 관측 지표)에 그대로 도달한다.
    #   메트릭은 Day2 Prometheus가 dodam-net 안에서 ai:8000/metrics 로만 스크레이프하며(nginx 미경유),
    #   외부에는 404로 경로 존재 자체를 숨긴다(403은 "있다"는 힌트가 됨). /ai/internal/ 과 같은 패턴.
    #   nginx는 최장 접두 매칭 — /ai/metrics 가 /ai/ 보다 길어 이 블록이 /ai/ 프록시보다 먼저 매칭된다.
    location /ai/metrics {
        # ⚠️ location에 add_header가 생기면 서버 블록의 add_header 상속이 끊긴다(위 주석)
        #    — 보안 헤더 3종 + HSTS를 그대로 복사해 이 응답에도 유지한다.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    # /ai/* → ai 분석 서비스(내부망 DNS 'ai', 8000)
    #   ★ proxy_pass 끝의 '/' 가 핵심: location 접두(/ai/)를 떼고 전달한다.
    #     예) 외부 /ai/tts → ai 컨테이너 /tts (ai 라우트는 루트 기준: /health,/stt,/tts,/analyze/*)
    #     (/api 는 반대로 접두 유지 — backend 라우트가 /api 하위라 proxy_pass 에 '/' 없음)
    #   ⚠️ /internal/* 는 위 블록이 먼저 차단 — 이 프록시로는 공개 경로만 지나간다.
    location /ai/ {
        proxy_pass http://ai:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 추론(STT·대화LLM·TTS를 GMS로 호출)은 응답이 느릴 수 있어 기본 60s→상향.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # APK 배포 파일 — 저장소가 아닌 네임드 볼륨(apk-dist)에서 서빙(바이너리는 git에 넣지 않는다).
    #   업로드(팀원): docker cp app-release.apk dodam-nginx:/var/www/apk/dodam.apk
    #   아직 업로드 전이면 404 — 정상. 안내 페이지는 /download/ (이미지에 bake).
    location = /download/dodam.apk {
        alias /var/www/apk/dodam.apk;
    }

    # /jenkins/ → Jenkins 컨트롤러(별도 compose의 dodam-jenkins, prefix=/jenkins).
    #   ⚠️ 변수+resolver 패턴이 핵심: 고정 proxy_pass는 nginx 시작 시 DNS를 해석해서
    #      Jenkins가 꺼져 있으면 nginx 전체가 못 뜬다(다른 compose라 depends_on 불가).
    #      변수를 쓰면 요청 시점에 해석 → Jenkins 부재 시에도 nginx는 뜨고 /jenkins만 502.
    location /jenkins/ {
        resolver 127.0.0.11 valid=30s;             # 도커 내장 DNS
        set $jenkins_upstream http://dodam-jenkins:8080;
        proxy_pass $jenkins_upstream;              # URI 미지정 → 원본 경로(/jenkins/...) 그대로 전달(프리픽스 일치)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Jenkins UI 일부 기능(로그 스트림 등) 웹소켓 대응
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # 프론트(커뮤니티 웹) 정적 서빙 (S15P11B209-302) — 현재는 준비중 안내 페이지(이미지에 bake).
    #   커뮤니티 웹 산출물이 생기면: 정적 export → 이 root 의 내용 교체(nginx Dockerfile COPY 대상 변경)
    #                              SSR(Next 서버) → 이 블록을 proxy_pass 로 전환 + compose에 web 서비스 추가
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;   # SPA 대비 — 미지의 경로도 index로(준비중 페이지)
    }
}
