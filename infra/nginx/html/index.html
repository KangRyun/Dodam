<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도담 — 아이의 마음을 그림으로 만나요</title>
  <!-- 커뮤니티 웹 준비 전 임시 페이지 (S15P11B209-302). 산출물이 생기면 이 파일 자리를 교체. -->
  <style>
    :root { --green:#3E9B6B; --bg:#F6F7F3; --ink:#25313A; --line:#E3E6E1; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      background:var(--bg); color:var(--ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card {
      background:#fff; border:1px solid var(--line); border-radius:20px;
      padding:48px 40px; max-width:420px; width:100%; text-align:center;
      box-shadow:0 4px 24px rgba(37,49,58,.06);
    }
    .logo { font-size:44px; margin-bottom:16px; }
    h1 { font-size:26px; color:var(--green); margin-bottom:12px; }
    p  { font-size:15px; line-height:1.7; color:#5a6670; }
    .badge {
      display:inline-block; margin-top:24px; padding:8px 16px; border-radius:999px;
      background:#eaf4ee; color:var(--green); font-size:13px; font-weight:600;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🧸</div>
    <h1>도담</h1>
    <p>아이의 마음을 그림으로 만나요.<br>
       커뮤니티 웹은 지금 열심히 준비하고 있어요.<br>
       그리기와 대화는 <strong>도담 앱</strong>에서 만나요!</p>
    <span class="badge">커뮤니티 웹 준비 중</span>
  </main>
</body>
</html>
