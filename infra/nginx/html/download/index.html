<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도담 앱 다운로드</title>
  <!-- 팀·데모용 APK 배포 페이지. APK 파일은 저장소가 아닌 네임드 볼륨(apk-dist)에서 서빙됨.
       업로드(팀원): docker cp app-release.apk dodam-nginx:/var/www/apk/dodam.apk -->
  <style>
    :root { --green:#3E9B6B; --orange:#E8823C; --bg:#F6F7F3; --ink:#25313A; --line:#E3E6E1; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      background:var(--bg); color:var(--ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card {
      background:#fff; border:1px solid var(--line); border-radius:20px;
      padding:40px 36px; max-width:440px; width:100%; text-align:center;
      box-shadow:0 4px 24px rgba(37,49,58,.06);
    }
    h1 { font-size:24px; color:var(--green); margin-bottom:6px; }
    .sub { font-size:14px; color:#5a6670; margin-bottom:24px; }
    .qr { width:200px; height:200px; margin:0 auto 20px; padding:12px;
          border:1px solid var(--line); border-radius:14px; background:#fff; }
    .qr svg, .qr img { width:100%; height:100%; }
    .btn {
      display:inline-block; padding:14px 28px; border-radius:999px;
      background:var(--orange); color:#fff; font-weight:700; font-size:15px;
      text-decoration:none; margin-bottom:24px;
    }
    ol { text-align:left; font-size:13px; color:#5a6670; line-height:1.9;
         padding-left:20px; border-top:1px solid var(--line); padding-top:16px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🧸 도담 앱 설치</h1>
    <p class="sub">태블릿·휴대폰 카메라로 QR을 찍으세요</p>
    <div class="qr"><img src="qr.svg" alt="APK 다운로드 QR"></div>
    <a class="btn" href="/download/dodam.apk">APK 직접 다운로드</a>
    <ol>
      <li>QR 스캔 또는 위 버튼으로 <strong>dodam.apk</strong> 다운로드</li>
      <li>안드로이드가 "출처를 알 수 없는 앱" 경고를 띄우면 <strong>허용</strong> (스토어 외 설치라 뜨는 정상 안내예요)</li>
      <li>설치 후 <strong>도담</strong> 앱 실행!</li>
    </ol>
  </main>
</body>
</html>
