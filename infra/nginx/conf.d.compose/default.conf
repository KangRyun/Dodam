# 도담 게이트웨이 conf — **컷백(k3s → docker-compose) 실행 전용**
#
# ★ 이 파일의 출처는 라이브 k3s 의 ConfigMap `gateway-conf` 다(2026-08-07 스냅샷).
#   즉 **지금 운영에서 실제로 돌고 있는 라우팅**이며, 두 곳만 도커용으로 바꿨다:
#     ① resolver 10.43.0.10(kube-dns) → 127.0.0.11(도커 내장 DNS)
#     ② dodam-jenkins / dodam-grafana 를 FQDN 대신 도커 네트워크 별칭으로
#   그 외 지시자는 한 글자도 바꾸지 않았다.
#
# ⚠️ `infra/nginx/conf.d/default.conf`(이미지 bake 소스)와 **일부러 분리했다.**
#   그쪽은 Jenkins 가 `dodam-nginx` 이미지를 구울 때 COPY 하는 빌드 입력이고,
#   이 파일은 컷백 compose 가 런타임에 마운트하는 실행 설정이다.
#
# ★ 분리해야만 하는 실질적 이유 — 라이브 이미지 `dodam-nginx:4ada1bdf` 에 구워진 conf 에는
#   `location /api/oauth/` 블록이 **없다.** 그 블록은 817(웹 소셜 로그인 code→token 교환)에서
#   k3s ConfigMap 쪽에만 추가됐고 bake 소스에는 반영되지 않았다.
#   그대로 띄우면 `/api/oauth/kakao` 가 `location /api/` 에 잡혀 Spring 으로 가고
#   COMMON_404_001 이 된다 — 코드·시크릿이 전부 정상이어도 버튼을 눌러야만 드러나는 결함이다.
#   그래서 컷백에서는 이 디렉터리를 /etc/nginx/conf.d 에 마운트해 이미지 안의 낡은 conf 를 덮는다.
#
# ⚠️ 2026-07-22 "빈 conf 마운트" 사고의 원인은 bind 마운트 자체가 아니라 **상대경로 + DooD** 였다.
#   compose 는 `${NGINX_CONF_DIR}` 로 **절대 호스트 경로**를 강제한다(미설정 시 렌더링 실패).
#   이 compose 를 Jenkins 컨테이너 안에서 실행하지 말 것.
#
# ⚠️ /grafana/ 는 컷백 후 **502 가 정상이다.** Grafana 는 지금 k3s 안에 있고(Deployment
#   dodam-grafana), k3s 를 내리면 도커 DNS 에 그 이름이 없다. 변수+resolver 패턴이라
#   nginx 자체는 정상 기동하고 다른 경로는 영향을 받지 않는다. 모니터링은 컷백 범위 밖.
#   ↔ /jenkins/ 는 다르다. dodam-jenkins 는 호스트 도커 컨테이너이고 dodam_dodam-net 에
#     별칭 dodam-jenkins 로 붙어 있어(실측 172.18.0.2) 컷백 후에도 그대로 동작한다.
#
# ⚠️ k3s 로 롤백하면 이 파일이 아니라 ConfigMap `gateway-conf` 가 다시 진실이 된다.
#   여기를 고쳤으면 `infra/k8s/base/gateway.yaml` 도 같이 고칠 것 — 두 벌이 갈라지면 사고가 난다.

server_tokens off;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name i15b209.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/i15b209.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15b209.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ★ 앱 상한보다 높아야 한다(S15P11B209-670). 낮거나 같으면 nginx 가 먼저 잘라
    #   클라이언트가 앱의 413 JSON 대신 nginx 기본 HTML 413 을 받는다(파싱 실패 → 원인 불명).
    #   기준선: spring.servlet.multipart.max-request-size = 22020096B(21 MiB).
    client_max_body_size 22m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 웹 소셜 로그인의 code→token 교환 (S15P11B209-817). Next Route Handler
    # (frontend/web/src/app/api/oauth/[provider]/route.ts) 가 처리한다 — client secret 이
    # 필요해 브라우저가 직접 못 하고, 그래서 웹 서버 쪽에 있어야 한다.
    #
    # ⚠️ 이 블록이 없으면 아래 `location /api/` 가 먼저 잡아 **Spring 으로 가고 404** 가 된다.
    #   코드·시크릿·매니페스트가 전부 정상이어도 브라우저에서 버튼을 눌러야만 드러나는
    #   종류의 결함이다(2026-08-04 실측: /api/oauth/kakao → COMMON_404_001).
    #   nginx 는 접두 location 중 **가장 긴 것**을 고르므로 순서와 무관하게 이 블록이 이긴다.
    #
    # 백엔드와 겹치지 않는다: 앱(Flutter)이 쓰는 백엔드 경로는 `/api/v1/auth/oauth/{provider}`
    # 이고(OAuthController @RequestMapping("/api/v1/auth")), 여기는 버전 없는 `/api/oauth/` 다.
    location /api/oauth/ {
        # 블루-그린: 고정 web:3000 대신 활성 색 upstream(upstream-active.conf) 을 가리킨다.
        proxy_pass http://web_active;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /api/ {
        # 블루-그린: 고정 backend:8080 대신 활성 색 upstream(upstream-active.conf) 을 가리킨다.
        proxy_pass http://backend_active;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BE 내부 API — 외부에는 경로 존재 자체를 숨긴다(403은 "있다"는 힌트가 된다).
    # ⚠️ location 에 add_header 가 생기면 server 블록 상속이 끊긴다 → 4종을 복사한다.
    location /internal/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    # /ai/ 는 접두를 떼고 전달하므로, 아래 두 블록이 없으면 외부에서
    # ai 컨테이너의 /internal/* 과 /metrics 에 그대로 도달한다.
    # nginx 최장 접두 매칭 — 둘 다 /ai/ 보다 길어 먼저 매칭된다.
    location /ai/internal/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    location /ai/metrics {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    # ── FastAPI 자동 문서 3종 외부 차단 (safety review W1) ──────────────────────
    #   ai/main.py:89 의 `FastAPI(title=..., version=...)` 는 docs_url·openapi_url·redoc_url 을
    #   **기본값 그대로** 둔다(/docs · /openapi.json · /redoc). 위 /ai/ 프록시가 접두를 떼고
    #   전달하므로, 이 블록이 없으면 외부에서 **내부 계약 스키마 전체**가 읽힌다 —
    #   엔드포인트 목록·요청/응답 필드명·모델 스키마가 그대로 노출되고, 그중에는
    #   아동 발화·그림 분석 계약(/internal/ai/v1/*)의 형태도 포함된다.
    #   /ai/internal/ · /ai/metrics 와 같은 처리다: 403 이 아니라 404 로 **존재 자체를 숨긴다**.
    #
    #   `=`(정확 일치)인 이유: FastAPI 기본 경로가 정확히 이 셋이고, 접두 매칭으로 넓게 잡으면
    #   향후 /ai/d… 로 시작하는 정상 분석 라우트까지 삼킬 수 있다.
    #   ⚠️ 남는 틈: `/ai/docs/oauth2-redirect` 는 정확 일치가 아니라 통과한다. 스키마가 없는
    #     정적 리다이렉트 페이지라 유출 가치는 없지만, 완전 차단이 필요하면 `= /ai/docs` 를
    #     접두 `location /ai/docs` 로 바꾸면 된다(그때는 위 트레이드오프를 다시 볼 것).
    location = /ai/docs {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    location = /ai/openapi.json {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    location = /ai/redoc {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    location /ai/ {
        # 블루-그린: 활성 색 upstream 을 가리킨다. ★ 끝의 '/' 는 그대로 유지 —
        #   upstream 이름 뒤 URI('/')가 있어야 접두(/ai/)를 떼고 전달한다(의미 동일).
        proxy_pass http://ai_active/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /download/dodam.apk {
        alias /var/www/apk/dodam.apk;
    }

    # ── /jenkins/ · /grafana/ — 이 스택(compose)의 서비스가 아니다 ─────────────
    #   ① resolver 는 **127.0.0.11**(도커 내장 DNS)이다. 이 nginx 는 파드가 아니라
    #      dodam_dodam-net 위의 컨테이너라서 kube-dns(10.43.0.10)에 닿지 않는다.
    #   ② 변수+resolver 패턴을 유지하는 이유: 고정 proxy_pass 는 nginx 가 **기동 시점에**
    #      이름을 해석하므로, 대상이 없으면 게이트웨이 전체가 못 뜬다. 변수로 두면
    #      요청 시점에 해석돼 대상 부재 시에도 nginx 는 뜨고 해당 경로만 502 다.
    #      backend·ai·web 이 고정 proxy_pass 인 것과 대비된다 — 그쪽은 같은 compose 파일에
    #      있어 항상 함께 뜨므로, 오타·DNS 실패가 기동 즉시 드러나는 편이 낫다.
    #   ⚠️ resolver 는 **IP 리터럴만** 받는다. 호스트명도 환경변수도 못 쓴다
    #      (dodam-nginx 이미지는 envsubst 템플릿을 쓰지 않고 conf 를 그대로 읽는다).
    #      127.0.0.11 은 도커가 모든 사용자 정의 브리지 네트워크에 심는 고정 주소라
    #      환경마다 달라지지 않는다.
    #
    #   ★ /jenkins/ 는 컷백 후에도 **동작한다.** dodam-jenkins 는 호스트 도커 컨테이너이고
    #     dodam_dodam-net 에 별칭 `dodam-jenkins` 로 붙어 있다(실측 172.18.0.2).
    #   ★ /grafana/ 는 컷백 중 **502 가 정상이다.** Grafana 는 지금 k3s 안에 있고
    #     (Deployment dodam-grafana), k3s 를 내리면 도커 DNS 에 그 이름이 없다.
    #     모니터링은 컷백 범위 밖이며, 다른 경로는 영향을 받지 않는다(위 ② 덕분).
    #     되살리려면 grafana 를 도커로 띄워 dodam_dodam-net 에 붙이면 이 블록이 그대로 먹는다.
    #     (헤더 주석의 같은 설명과 반드시 일치시킬 것 — 갈라지면 다음 사람이 502 를 장애로 읽는다.)
    location /jenkins/ {
        resolver 127.0.0.11 valid=30s;   # 도커 내장 DNS
        set $jenkins_upstream http://dodam-jenkins:8080;
        proxy_pass $jenkins_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location /grafana/ {
        resolver 127.0.0.11 valid=30s;   # 도커 내장 DNS
        set $grafana_upstream http://dodam-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # ★ /legal/ · /download/ 는 이미지에 bake 된 정적 페이지다(dodam-nginx 의 html/).
    #   383 전에는 catch-all `location /` 이 정적 root 를 서빙해서 이 둘이 딸려 왔다.
    #   `location /` 을 웹 프록시로 바꾸는 순간 **딸려오던 것이 사라진다** —
    #   전용 location 이 없으면 개인정보처리방침·이용약관이 통째로 404 가 된다.
    #   그 URL 은 스토어 심사에 등록돼 있어 조용히 깨지면 안 된다(가드레일 9절).
    #   nginx 최장 접두사 매칭이라 아래 두 블록이 `location /` 보다 먼저 잡힌다.
    location /legal/ {
        root /usr/share/nginx/html;
        index index.html;
    }

    # /download/dodam.apk 는 위에 `location =` 정확일치가 따로 있다(볼륨의 실제 APK).
    # 이 블록은 그 옆의 안내 페이지(index.html·qr.svg)를 계속 서빙한다.
    location /download/ {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 나머지 전부 → 커뮤니티 웹(Next.js standalone). S15P11B209-383
    #   위의 /api/·/ai/·/grafana/·/jenkins/·/legal/·/download/ 가 최장 접두사 매칭으로
    #   항상 먼저 잡히고, 여기까지 내려온 요청만 웹이 받는다.
    #
    #   ⚠️ 변수+resolver 를 쓰지 않고 고정 proxy_pass 다. /jenkins/·/grafana/ 가
    #      변수를 쓰는 건 그 백엔드가 없을 때도 nginx 가 떠야 하기 때문인데,
    #      web 은 같은 kustomize base 에 있어 항상 함께 배포된다. 고정으로 두면
    #      오타·DNS 실패가 기동 시점에 바로 드러나서 오히려 낫다.
    location / {
        # 블루-그린: 고정 web:3000 대신 활성 색 upstream(upstream-active.conf) 을 가리킨다.
        proxy_pass http://web_active;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next 의 HMR 은 운영에 없지만, 향후 스트리밍 응답을 위해 1.1 로 둔다.
        proxy_http_version 1.1;
    }
}
