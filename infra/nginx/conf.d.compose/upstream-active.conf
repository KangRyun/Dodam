# 도담 게이트웨이 — 블루-그린 **활성 색 스위치** (단일 노드형 무중단 배포)
#
# ★ 이 파일은 nginx 가 backend/ai/web 을 어느 색으로 보낼지 가리키는 **유일한 스위치**다.
#   `default.conf` 의 location 블록들은 여기서 정의한 세 upstream 을 참조한다:
#     /api/       → backend_active
#     /api/oauth/ → web_active   · /  → web_active
#     /ai/        → ai_active   (접두 /ai/ 를 떼고 전달 — default.conf 의 trailing slash 유지)
#
# ★ 전환 방식: `infra/scripts/bluegreen-deploy.sh` 가 유휴 색을 띄워 헬스체크를 통과시킨 뒤,
#   이 파일의 `server` 줄만 blue↔green 으로 다시 쓰고 `nginx -t && nginx -s reload` 한다.
#   default.conf 본문은 한 줄도 바뀌지 않는다 — 라우팅 로직과 색 선택을 분리한 것이 요점이다.
#
# ⚠️ 이 파일은 `/etc/nginx/conf.d/` 에 **와일드카드(`*.conf`)로 자동 include** 된다
#   (이미지 nginx.conf: `include /etc/nginx/conf.d/*.conf;` 실측). 그래서 default.conf 안에
#   `include` 지시자를 따로 두지 않는다 — 두면 이 파일이 두 번 로드돼 "duplicate upstream" 으로
#   nginx 가 못 뜬다. upstream 은 nginx 가 전방 참조(forward reference)를 허용하므로
#   default.conf(알파벳상 먼저 로드)가 아래 upstream 을 참조해도 정상이다(-t 로 검증).
#
# ⚠️⚠️ 이 디렉터리는 **운영 nginx 에 read-only 로 라이브 바인드**돼 있다
#   (NGINX_CONF_DIR=/home/kr/S15P11B209/infra/nginx/conf.d.compose → /etc/nginx/conf.d).
#   즉 이 파일을 저장하는 순간 컨테이너 안 디스크가 바뀐다. nginx 는 reload/restart 때만
#   다시 읽으므로 평시엔 무해하지만, **여기 적힌 upstream 대상이 떠 있지 않으면**
#   그 다음 reload 나 (재부팅 시) 컨테이너 재기동에서 nginx 가 "host not found in upstream"
#   으로 **기동 자체에 실패**해 게이트웨이 전체가 죽는다.
#   → 그래서 아래 초기값은 **지금 실제로 떠 있는 레거시 단일 서비스**(backend·ai·web)를
#     가리킨다. 이 상태는 현재 라우팅과 100% 동일하고 재부팅에도 안전하다.
#   → 최초 컷오버(레거시 → blue)는 사람이 런북으로 수행한다(deploy 스크립트 헤더 참조).
#     그때 blue 컨테이너를 먼저 띄운 뒤 이 파일을 blue 로 바꾸고 reload 하므로 순단이 없다.
#     컷오버 이후에는 스크립트가 blue↔green 만 오간다.

upstream backend_active { server backend-blue:8080; }
upstream ai_active      { server ai-blue:8000; }
upstream web_active     { server web-blue:3000; }
